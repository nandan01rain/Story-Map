// A patch written in Claude: paste it, or drop / choose the .md files Claude gave you. Each
// becomes a document, titled from its first heading, previewed before anything is saved.
function importPatch(){
  const pending = [];
  const titleOf = (text, fallback) => (text.split('\n').map((l) => l.trim()).find((l) => /^#{1,3}\s+\S/.test(l)) || '').replace(/^#+\s*/, '').replace(/[*_`]/g, '').trim() || fallback;
  const el = openOverlay(`<div class="sheet" style="width:min(900px,100%)">
    <h3>IMPORT A PATCH FROM CLAUDE</h3>
    <p class="hand-body" style="margin:0 0 8px;color:var(--dim);font-size:17px">Paste the patch below, or drop the .md files Claude gave you here. Each becomes a document in the library, titled from its first heading.</p>
    <textarea class="big" rows="9" id="ip-paste" placeholder="Paste a patch here…"></textarea>
    <div class="row"><button class="btn" id="ip-add">Add pasted text</button><button class="btn" id="ip-files">Choose .md files…</button><span class="status">or drag files onto this box</span></div>
    <div id="ip-list" style="margin-top:12px"></div>
    <div class="row"><span style="flex:1"></span><button class="btn" data-a="cancel">Cancel</button><button class="btn solid" data-a="save">Add to Documents</button></div>
  </div>`);
  const draw = () => {
    el.querySelector('#ip-list').innerHTML = pending.map((p, i) => `<div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center"><input data-i="${i}" data-k="title" value="${esc(p.title)}" style="flex:1;font-family:var(--heading)">
      <select data-i="${i}" data-k="type">${DOC_TYPES.filter((t) => t !== 'Archive').map((t) => `<option ${p.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="btn danger" data-rm="${i}">×</button></div>
      <details style="margin-top:6px"><summary class="status">Preview (${p.content.length.toLocaleString()} characters)</summary><div class="md" style="max-height:300px;overflow:auto;font-size:15px">${md(p.content)}</div></details></div>`).join('');
  };
  const add = (content, fallback) => { if (content.trim()) { pending.push({ content, title: titleOf(content, fallback), type: 'Other' }); draw(); } };
  el.querySelector('#ip-add').onclick = () => { const ta = el.querySelector('#ip-paste'); add(ta.value, 'Patch ' + new Date().toISOString().slice(0, 10)); ta.value = ''; };
  const readFiles = async (files) => { for (const f of files) add(await f.text(), f.name.replace(/\.(md|markdown|txt)$/i, '')); };
  el.querySelector('#ip-files').onclick = async () => readFiles(await pickFile('.md,.markdown,.txt,text/markdown,text/plain', true));
  el.ondragover = (e) => e.preventDefault();
  el.ondrop = (e) => { e.preventDefault(); readFiles([...e.dataTransfer.files]); };
  el.querySelector('#ip-list').oninput = (e) => { const t = e.target; if (t.dataset.i != null) pending[Number(t.dataset.i)][t.dataset.k] = t.value; };
  el.querySelector('#ip-list').onchange = el.querySelector('#ip-list').oninput;
  el.querySelector('#ip-list').onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) { pending.splice(Number(b.dataset.rm), 1); draw(); } };
  el.querySelector('[data-a="cancel"]').onclick = closeOverlay;
  el.querySelector('[data-a="save"]').onclick = async () => {
    const ta = el.querySelector('#ip-paste'); if (ta.value.trim()) { add(ta.value, 'Patch ' + new Date().toISOString().slice(0, 10)); ta.value = ''; }
    if (!pending.length) return alert('Paste a patch or choose a file first.');
    const rows = pending.map((p) => ({ id: uuid(), user_id: userId, project_id: projectId, title: p.title.trim() || 'Untitled patch', type: p.type, content: p.content }));
    const { error } = await sb.from('documents').insert(rows);
    if (error) return alert(error.message);
    closeOverlay(); DC.open = rows[0].id; await loadDocs(); drawDocList(); drawDoc(); tellParent('documents');
  };
}

/* ====================================================================== WRITE */
// The phone's continuous Writer (handoff §33), for the web: one book as one scrolling
// manuscript, every chapter editable under its own heading, the previous chapter still above
// the next sentence. The per-chapter Editor in the web app keeps the flags, pairing and
// history; a heading's "Flags & history" opens it.
//
// Saving is per chapter, on the phone's rule: debounced, and the text the chapter had when it
// was opened here is kept in `versions` (capped at 10) the first time it is overwritten -- one
// version per visit, not per keystroke. Each save is CONDITIONAL on the chapter's updated_at
// being what it was when this page read it. The phone writes the same rows, and an
// unconditional save would silently put this page's copy over a paragraph typed there; instead
// the chapter says it was changed elsewhere and asks which to keep, and the one not kept goes
// into its version history. Nothing is lost either way.
//
// Words today: the project's finished prose now (chapters only, never pages) minus what it was
// the first time this browser opened the Writer today -- the phone's rule, kept per device as
// the phone keeps it.
const WR = { book: null, chapters: [], drafts: new Map(), actLabels: {}, notify: null, savedAny: false };
const WRITE_DEBOUNCE = 1200, MAX_VERSIONS = 10;
const countWords = (t) => (t || '').trim().split(/\s+/).filter(Boolean).length;
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const local = {
  get(k, fallback){ try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* a lost preference costs nothing */ } },
};
const byBookOrder = (a, b) => a.book - b.book || a.act - b.act || a.order - b.order;

async function loadChapters(){
  const [{ data, error }, st] = await Promise.all([
    sb.from('chapters').select('id, book, act, order, title, status, content, versions, updated_at').eq('project_id', projectId),
    sb.from('project_settings').select('act_labels').eq('project_id', projectId).maybeSingle(),
  ]);
  if (error) throw error;
  WR.chapters = (data || []).sort(byBookOrder);
  WR.actLabels = (st.data && st.data.act_labels) || {};
  S.chapters = WR.chapters.map(({ id, book, act, order, title }) => ({ id, book, act, order, title }));
  // A draft with unsaved text keeps it; a clean one adopts the server's copy.
  for (const ch of WR.chapters) {
    const d = WR.drafts.get(ch.id);
    if (d && (d.content !== d.saved || d.conflict)) continue;
    WR.drafts.set(ch.id, { content: ch.content || '', saved: ch.content || '', updatedAt: ch.updated_at, snapshotted: false, timer: null, inflight: null, conflict: null });
  }
}
const dirty = () => [...WR.drafts.entries()].filter(([, d]) => d.content !== d.saved);

// The web app refetches its chapters when told, and that is not free: once per pause, not per save.
function notifyChapters(now = false){
  clearTimeout(WR.notify);
  if (now) { if (WR.savedAny) tellParent('chapters'); WR.savedAny = false; return; }
  WR.notify = setTimeout(() => notifyChapters(true), 2500);
}

// Where a chapter came from: the scenes that became it and the storyboard notes that point at
// it, each found from the other side's link, so nothing new is stored.
function trailLinks(chapterId){
  const scenes = S.treatments.filter((t) => t.became_type === 'chapter' && t.became_id === chapterId);
  const notes = S.events.filter((e) => e.chapter_id === chapterId);
  return scenes.map((t) => ` · <a href="#" data-trail-scene="${t.id}" title="${esc(sketchTitle(t))}">Scene</a>`).join('')
    + notes.map((e) => ` · <a href="#" data-trail-note="${e.book}" title="${esc(e.title || 'Untitled note')}">Storyboard</a>`).join('');
}

async function renderWrite(opts = {}){
  await Promise.all([loadChapters(), loadSketches().catch(() => {}), loadBoard().catch(() => {})]);
  if (!WR.chapters.length) {
    view.innerHTML = '<div class="note-msg">No chapters yet. Add them from the web app\'s list, or make one from a scene.</div>';
    return;
  }
  const books = [...new Set(WR.chapters.map((c) => c.book))].sort((a, b) => a - b);
  const target = opts.chapter && WR.chapters.find((c) => c.id === opts.chapter);
  if (target) WR.book = target.book;
  if (WR.book == null) WR.book = local.get(`studio-write-book:${projectId}`, books[0]);
  if (!books.includes(WR.book)) WR.book = books[0];
  const base = local.get(`studio-daily-baseline:${projectId}`, null);
  if (!base || base.date !== todayKey()) local.set(`studio-daily-baseline:${projectId}`, { date: todayKey(), words: projectWords() });

  view.innerHTML = `<div class="split wr"><div class="side"><div class="top">
      <div class="groups" id="wr-books">${books.map((b) => `<button class="chip ${b === WR.book ? 'on' : ''}" data-b="${b}">${bookName(b)}</button>`).join('')}</div>
      <div id="wr-today"></div>
      <button class="btn" id="wr-report">Prose report — this book</button>
    </div><div class="list" id="wr-toc"></div></div><div class="pane" id="wr-pane"></div></div>`;
  $('#wr-books').onclick = async (e) => {
    const b = e.target.closest('[data-b]'); if (!b || Number(b.dataset.b) === WR.book) return;
    await flushWrite();
    WR.book = Number(b.dataset.b); local.set(`studio-write-book:${projectId}`, WR.book);
    document.querySelectorAll('#wr-books .chip').forEach((c) => c.classList.toggle('on', c === b));
    drawWrite();
  };
  $('#wr-report').onclick = () => showReport(bookName(WR.book), bookChapters().map((c) => WR.drafts.get(c.id).content).join('\n\n'));
  drawWrite(target ? target.id : null);
  if (opts.report) $('#wr-report').click();
}

const bookChapters = () => WR.chapters.filter((c) => c.book === WR.book);
function projectWords(){ return WR.chapters.reduce((n, c) => n + countWords(WR.drafts.get(c.id)?.content ?? c.content), 0); }

function drawToday(){
  const el = $('#wr-today'); if (!el) return;
  const base = local.get(`studio-daily-baseline:${projectId}`, { words: projectWords() });
  const today = Math.max(0, projectWords() - base.words);
  const target = Number(local.get(`studio-daily-target:${projectId}`, 0)) || 0;
  const pct = target ? Math.min(100, Math.round((today / target) * 100)) : 0;
  el.innerHTML = `<div class="wr-today" title="Finished prose added since this browser first opened the Writer today. Counted per device, like the phone's.">
      <div><b>${today.toLocaleString()}</b> ${target ? `of ${target.toLocaleString()} ` : ''}words today ${target && today >= target ? '✓' : ''}</div>
      ${target ? `<div class="meter"><i style="width:${pct}%"></i></div>` : ''}
      <a href="#" id="wr-target">${target ? 'Change the daily target' : 'Set a daily target'}</a>
    </div>`;
  $('#wr-target').onclick = (e) => {
    e.preventDefault();
    const v = prompt('Words a day (0 for none):', String(target || 1000)); if (v == null) return;
    local.set(`studio-daily-target:${projectId}`, Math.max(0, Math.round(Number(v) || 0))); drawToday();
  };
}

function drawWrite(focusId = null){
  const list = bookChapters();
  const number = (id) => list.indexOf(list.find((c) => c.id === id)) + 1;
  $('#wr-toc').innerHTML = list.map((c) => `<button class="item" data-id="${c.id}"><div style="font-size:15px">${number(c.id)}. ${esc(c.title || 'Untitled')}</div><div class="status" data-toc-wc="${c.id}">${countWords(WR.drafts.get(c.id).content).toLocaleString()} words</div></button>`).join('');
  $('#wr-toc').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) document.getElementById('ch-' + b.dataset.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  let act = null;
  $('#wr-pane').innerHTML = `<div class="reader manuscript">${list.map((c) => {
    const head = c.act !== act ? `<div class="wr-act">${esc(WR.actLabels[`${c.book}-${c.act}`] || 'Act ' + c.act)}</div>` : '';
    act = c.act;
    return `${head}<section class="wr-ch" id="ch-${c.id}" data-id="${c.id}">
      <div class="wr-head"><span class="wr-n">CHAPTER ${number(c.id)}</span><h2>${esc(c.title || 'Untitled')}</h2>
        <span class="wr-meta"><span data-wc>${countWords(WR.drafts.get(c.id).content).toLocaleString()} words</span>${trailLinks(c.id)} · <a href="#" data-a="report">Report</a>${inFrame ? ' · <a href="#" data-a="editor">Flags &amp; history</a>' : ''} <span class="status" data-st></span></span></div>
      <div class="wr-conflict" hidden></div>
      <textarea class="wr-ta" spellcheck="true" placeholder="Begin…">${esc(WR.drafts.get(c.id).content)}</textarea>
    </section>`;
  }).join('')}</div>`;
  const pane = $('#wr-pane');
  pane.querySelectorAll('.wr-ch').forEach((sec) => {
    const id = sec.dataset.id; const ta = sec.querySelector('textarea');
    ta.oninput = () => {
      const d = WR.drafts.get(id); d.content = ta.value; fit(ta);
      const n = countWords(ta.value).toLocaleString() + ' words';
      sec.querySelector('[data-wc]').textContent = n;
      const toc = document.querySelector(`[data-toc-wc="${id}"]`); if (toc) toc.textContent = n;
      scheduleSave(id); drawToday();
    };
    sec.querySelectorAll('[data-trail-scene]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); go('sketches', { sketch: a.dataset.trailScene }); }));
    sec.querySelectorAll('[data-trail-note]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); SB.book = Number(a.dataset.trailNote); go('storyboard'); }));
    sec.querySelector('[data-a="report"]').onclick = (e) => { e.preventDefault(); showReport(WR.chapters.find((c) => c.id === id).title, WR.drafts.get(id).content); };
    const ed = sec.querySelector('[data-a="editor"]');
    if (ed) ed.onclick = async (e) => {
      e.preventDefault();
      if (!(await flushWrite())) return alert('This chapter is not saved yet — settle it here first.');
      notifyChapters(true);
      window.parent.postMessage({ type: 'studio-open-chapter', id }, location.origin);
    };
    if (WR.drafts.get(id).conflict) drawConflict(id);
  });
  // Heights follow the text's wrapped length, so they are refit whenever the column's width is
  // known or changes -- once at first layout is not enough: in a frame still being sized, or
  // before the serif font arrives, the measurement is of a different column.
  const refit = () => pane.querySelectorAll('.wr-ta').forEach(fit);
  let lastWidth = 0;
  WR.observer?.disconnect();
  WR.observer = new ResizeObserver(() => { const w = pane.clientWidth; if (w && w !== lastWidth) { lastWidth = w; refit(); } });
  WR.observer.observe(pane);
  document.fonts?.ready.then(refit);
  requestAnimationFrame(() => {
    refit();
    const key = `studio-write-scroll:${projectId}:${WR.book}`;
    if (focusId) document.getElementById('ch-' + focusId)?.scrollIntoView({ block: 'start' });
    else pane.scrollTop = local.get(key, 0);
    let t = null;
    pane.onscroll = () => { clearTimeout(t); t = setTimeout(() => local.set(key, pane.scrollTop), 400); };
  });
  drawToday();
}
// Where the browser can size a textarea to its content itself (field-sizing, Chromium 123+),
// it does; elsewhere it is measured.
const NATIVE_FIT = !!(window.CSS && CSS.supports('field-sizing', 'content'));
function fit(ta){ if (NATIVE_FIT) return; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }

const sectionOf = (id) => document.getElementById('ch-' + id);
function setStatus(id, text){ const s = sectionOf(id)?.querySelector('[data-st]'); if (s) s.textContent = text; }

function scheduleSave(id){
  const d = WR.drafts.get(id);
  setStatus(id, 'Editing…');
  clearTimeout(d.timer);
  d.timer = setTimeout(() => { d.timer = null; saveChapter(id); }, WRITE_DEBOUNCE);
}

// One save at a time per chapter: a second would carry an updated_at the first is about to change.
function saveChapter(id){
  const d = WR.drafts.get(id);
  clearTimeout(d.timer); d.timer = null;
  const run = async () => {
    if (d.content === d.saved) return true;
    if (d.conflict) return false;
    const ch = WR.chapters.find((c) => c.id === id);
    const prior = d.saved;
    const versions = !d.snapshotted && prior.trim()
      ? [{ content: prior, savedAt: Date.now(), words: countWords(prior) }, ...(ch.versions || [])].slice(0, MAX_VERSIONS)
      : (ch.versions || []);
    const content = d.content;
    setStatus(id, 'Saving…');
    let q = sb.from('chapters').update({ content, versions, updated_at: new Date().toISOString() }).eq('id', id);
    q = d.updatedAt ? q.eq('updated_at', d.updatedAt) : q.is('updated_at', null);
    const { data, error } = await q.select('updated_at');
    if (error) { setStatus(id, 'Not saved: ' + error.message); return false; }
    if (!data || !data.length) { await openConflict(id); return false; }
    d.saved = content; d.updatedAt = data[0].updated_at; d.snapshotted = true;
    ch.content = content; ch.versions = versions; ch.updated_at = d.updatedAt;
    WR.savedAny = true; notifyChapters();
    setStatus(id, d.content === content ? 'Saved' : 'Editing…');
    return true;
  };
  d.inflight = (d.inflight || Promise.resolve()).then(run, run);
  return d.inflight;
}

/** Save every chapter with unsaved text. False if any could not be saved. */
async function flushWrite(){
  const results = await Promise.all(dirty().map(([id]) => saveChapter(id)));
  return results.every(Boolean);
}

async function openConflict(id){
  const { data } = await sb.from('chapters').select('content, versions, updated_at').eq('id', id).single();
  WR.drafts.get(id).conflict = data || { content: '', versions: [], updated_at: null };
  setStatus(id, 'Not saved');
  drawConflict(id);
}
function drawConflict(id){
  const box = sectionOf(id)?.querySelector('.wr-conflict'); if (!box) return;
  const d = WR.drafts.get(id); const theirs = d.conflict;
  box.hidden = false;
  box.innerHTML = `<b>Changed somewhere else</b> (on the phone?) since it opened here — that copy has ${countWords(theirs.content).toLocaleString()} words, this one ${countWords(d.content).toLocaleString()}.
    Whichever you do not keep goes into the chapter's version history.
    <div class="row" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" data-k="mine">Keep what is here</button><button class="btn" data-k="theirs">Take the other copy</button></div>`;
  box.querySelector('[data-k="mine"]').onclick = async () => {
    // Their text becomes the version this save keeps; then save on top of their updated_at.
    const ch = WR.chapters.find((c) => c.id === id);
    ch.versions = theirs.versions || []; d.saved = theirs.content || ''; d.updatedAt = theirs.updated_at; d.snapshotted = false; d.conflict = null;
    box.hidden = true;
    if (!(await saveChapter(id))) return;
  };
  box.querySelector('[data-k="theirs"]').onclick = async () => {
    const mine = d.content;
    const versions = mine.trim() ? [{ content: mine, savedAt: Date.now(), words: countWords(mine) }, ...(theirs.versions || [])].slice(0, MAX_VERSIONS) : (theirs.versions || []);
    let q = sb.from('chapters').update({ versions, updated_at: new Date().toISOString() }).eq('id', id);
    q = theirs.updated_at ? q.eq('updated_at', theirs.updated_at) : q.is('updated_at', null);
    const { data, error } = await q.select('updated_at');
    if (error) return alert(error.message);
    if (!data || !data.length) { await openConflict(id); return; } // changed yet again: ask again
    const ch = WR.chapters.find((c) => c.id === id);
    ch.content = theirs.content || ''; ch.versions = versions; ch.updated_at = data[0].updated_at;
    Object.assign(d, { content: ch.content, saved: ch.content, updatedAt: ch.updated_at, snapshotted: true, conflict: null });
    WR.savedAny = true; notifyChapters();
    const ta = sectionOf(id).querySelector('textarea'); ta.value = ch.content; fit(ta);
    box.hidden = true; setStatus(id, 'Took the other copy');
    drawToday();
  };
}
window.addEventListener('beforeunload', (e) => { if (dirty().length) { e.preventDefault(); e.returnValue = ''; } });

/* ====================================================================== PROSE REPORT */
// lib/proseReport.ts, ported line for line so the two apps report the same numbers. No model,
// no network. Heuristics over plain text, and worded as such.
const STOPWORDS = new Set(('a an the and or but if then so of to in on at by for with from as is was were be been being ' +
  'are am it its this that these those he she they them his her their we you i me my our your ' +
  'him us who whom which what when where why how not no nor do does did done have has had ' +
  'having will would shall should can could may might must there here than too very into onto ' +
  'out up down over under again off about after before between through during without within ' +
  'all any each few more most other some such only own same both either neither one two ' +
  'said say says just like get got go went come came back made make take took see saw ' +
  'know knew thought think felt feel look looked put let').split(/\s+/));
const FILTER_WORDS = ['just','really','very','suddenly','somewhat','rather','quite','almost','seemed','seem','felt','feel','saw','see','heard','hear','noticed','notice','realized','realised','watched','watch','wondered','decided','knew','thought','began','started','somehow'];
const DIALOGUE_TAGS = ['said','asked','replied','whispered','shouted','muttered','murmured','cried','called','answered','added','continued','snapped','hissed','growled','laughed','sighed','breathed','yelled','exclaimed','demanded','insisted','began','went on','told','repeated','agreed'];
const NOT_ADVERB = new Set(['only','family','early','reply','supply','ally','belly','fly','holy','jolly','lily','silly','ugly','apply','rely','italy','july']);
const BAND_LABEL = { short: '1–8', medium: '9–20', long: '21–35', 'very-long': '36+' };
const bandOf = (n) => (n <= 8 ? 'short' : n <= 20 ? 'medium' : n <= 35 ? 'long' : 'very-long');
const splitSentences = (text) => text.replace(/\r\n?/g, '\n').split(/(?<=[.!?]["”’']?)\s+|\n{2,}/).map((s) => s.trim()).filter((s) => /[A-Za-z]/.test(s));
const wordsOf = (text) => (text.toLowerCase().match(/[a-z][a-z'’-]*/g) || []).map((w) => w.replace(/[’']s$/, ''));
const tally = (map, key) => map.set(key, (map.get(key) || 0) + 1);
const top = (map, n) => [...map].sort((a, b) => b[1] - a[1]).slice(0, n);

function analyseProse(text){
  const paragraphsRaw = text.replace(/\r\n?/g, '\n').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
  const sentences = splitSentences(text);
  const allWords = wordsOf(text);
  const total = allWords.length;
  const lengths = sentences.map((s) => wordsOf(s).length).filter((n) => n > 0);
  const sorted = [...lengths].sort((a, b) => a - b);
  const avg = lengths.length ? lengths.reduce((a, b) => a + b, 0) / lengths.length : 0;
  const bands = { short: 0, medium: 0, long: 0, 'very-long': 0 };
  let run = { band: 'medium', length: 0 }, cur = null;
  for (const n of lengths) {
    const b = bandOf(n); bands[b] += 1;
    if (cur && cur.band === b) cur.length += 1; else cur = { band: b, length: 1 };
    if (cur.length > run.length) run = { ...cur };
  }
  const openings = new Map();
  for (const s of sentences) { const w = wordsOf(s); if (w.length >= 2) tally(openings, `${w[0]} ${w[1]}`); }
  const freq = new Map();
  for (const w of allWords) if (w.length >= 4 && !STOPWORDS.has(w)) tally(freq, w);
  const per = (c) => (total ? (c / total) * 1000 : 0);
  const adv = new Map(); let advCount = 0;
  for (const w of allWords) if (w.endsWith('ly') && w.length > 4 && !NOT_ADVERB.has(w)) { advCount += 1; tally(adv, w); }
  const fw = new Map();
  for (const w of allWords) if (FILTER_WORDS.includes(w)) tally(fw, w);
  const quoted = text.match(/["“][^"”]{1,600}["”]/g) || [];
  const quotedWords = quoted.reduce((n, q) => n + wordsOf(q).length, 0);
  const tags = new Map();
  for (const m of text.match(/["”][,.]?\s+(?:[A-Z][a-z]+|he|she|they|I|we)\s+([a-z]+(?:\s+on)?)/g) || []) {
    const verb = (m.split(/\s+/).slice(-1)[0] || '').toLowerCase();
    if (DIALOGUE_TAGS.includes(verb)) tally(tags, verb);
  }
  const paraLens = paragraphsRaw.map((p) => wordsOf(p).length);
  return {
    words: total, sentences: lengths.length, paragraphs: paragraphsRaw.length,
    avgSentence: Math.round(avg * 10) / 10, medianSentence: sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0,
    bands, longestSameBandRun: run,
    repeatedOpenings: [...openings].filter(([, c]) => c > 1).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([opening, count]) => ({ opening, count })),
    overusedWords: [...freq].filter(([, c]) => c >= 3).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([word, count]) => ({ word, count, perThousand: Math.round(per(count) * 10) / 10 })),
    adverbs: { perThousand: Math.round(per(advCount) * 10) / 10, top: top(adv, 6).map(([word, count]) => ({ word, count })) },
    filterWords: top(fw, 10).map(([word, count]) => ({ word, count })),
    dialogue: { share: total ? Math.round((quotedWords / total) * 100) : 0, tags: top(tags, 8).map(([tag, count]) => ({ tag, count })) },
    paragraphLength: { avg: paraLens.length ? Math.round(paraLens.reduce((a, b) => a + b, 0) / paraLens.length) : 0, longest: paraLens.length ? Math.max(...paraLens) : 0 },
  };
}

function showReport(subject, text){
  const r = (text || '').trim() ? analyseProse(text) : null;
  const card = (title, hint, items, empty) => `<div class="rp-card"><h3>${esc(title).toUpperCase()}</h3><p class="rp-hint">${esc(hint)}</p>${items.length ? `<div class="rp-list">${items.map((x) => `<span>${esc(x.text)}</span><b>${x.count}${x.meta ? ` <i>${esc(x.meta)}</i>` : ''}</b>`).join('')}</div>` : `<p class="rp-hint">${esc(empty)}</p>`}</div>`;
  const bandMax = r ? Math.max(1, ...Object.values(r.bands)) : 1;
  const el = openOverlay(`<div class="sheet report" style="width:min(640px,100%)">
    <div style="display:flex;align-items:center;gap:10px"><span class="hand" style="font-size:30px;color:var(--gold);flex:1;line-height:1.1;padding-right:4px">${esc(subject || 'Prose report')}</span><button class="x" data-a="close">&times;</button></div>
    ${!r ? '<p class="hand-body" style="color:var(--dim)">Nothing written here yet.</p>' : `
    <div class="rp-stats"><div><b>${r.words.toLocaleString()}</b>words</div><div><b>${r.sentences.toLocaleString()}</b>sentences</div><div><b>${r.paragraphs.toLocaleString()}</b>paragraphs</div></div>
    <div class="rp-card"><h3>SENTENCE LENGTH</h3><p class="rp-hint">Average ${r.avgSentence} words, median ${r.medianSentence}. Longest run of one length: ${r.longestSameBandRun.length} ${r.longestSameBandRun.band.replace('-', ' ')} sentences in a row.</p>
      ${Object.keys(r.bands).map((b) => `<div class="rp-bar"><span>${BAND_LABEL[b]}</span><div><i style="width:${Math.round((r.bands[b] / bandMax) * 100)}%"></i></div><b>${r.bands[b]}</b></div>`).join('')}</div>
    ${card('Repeated openings', 'Sentences that begin with the same two words.', r.repeatedOpenings.map((o) => ({ text: `“${o.opening}…”`, count: o.count })), 'No sentence opening repeats.')}
    ${card('Overused words', 'Content words, with how many per thousand.', r.overusedWords.map((w) => ({ text: w.word, count: w.count, meta: `${w.perThousand}‰` })), 'Nothing leans on one word.')}
    ${card(`Adverbs · ${r.adverbs.perThousand} per thousand words`, '-ly words. Under 10 per thousand is spare; over 30 is a habit.', r.adverbs.top.map((w) => ({ text: w.word, count: w.count })), 'None.')}
    ${card('Filter words', 'Words that put narration between the reader and the thing: felt, saw, suddenly, really…', r.filterWords.map((w) => ({ text: w.word, count: w.count })), 'None.')}
    ${card(`Dialogue · ${r.dialogue.share}% of the words`, "Tags used after a closing quote. 'Said' disappearing is the goal; a spread of synonyms is not.", r.dialogue.tags.map((t) => ({ text: t.tag, count: t.count })), 'No tagged dialogue found.')}
    <div class="rp-card"><h3>PARAGRAPHS</h3><p class="rp-hint">Average ${r.paragraphLength.avg} words; the longest is ${r.paragraphLength.longest}.</p></div>`}
  </div>`);
  el.querySelector('[data-a="close"]').onclick = closeOverlay;
}

/* ====================================================================== SKETCH -> CHAPTER */
// The phone's rule: the chapter gets a COPY of the sketch's text and the sketch stays exactly
// as it is, marked with what it became; its note on the storyboard follows it into the
// manuscript. New chapters go at the end of the act chosen.
function makeChapter(t){
  const v = liveVersion(t.id);
  const books = booksInUse(true);
  const actsOf = (b) => { const a = [...new Set(S.chapters.filter((c) => c.book === b).map((c) => c.act))].sort((x, y) => x - y); return a.length ? a : [1]; };
  const el = openOverlay(`<div class="sheet"><h3>MAKE THIS A CHAPTER</h3>
    <select data-k="book">${books.map((b) => `<option value="${b}">${bookName(b)}</option>`).join('')}</select>
    <h3>ACT</h3><select data-k="act"></select>
    <h3>CHAPTER TITLE</h3><input class="big" data-k="title" value="${esc(noPrefix(sketchTitle(t)).slice(0, 120))}">
    <p class="hand-body" style="color:var(--dim);font-size:17px;margin:10px 0 0">The chapter gets a copy of the text. This scene stays exactly as it is.</p>
    <div class="row"><span style="flex:1"></span><button class="btn" data-a="cancel">Cancel</button><button class="btn solid" data-a="make">Make the chapter</button></div></div>`);
  const bookSel = el.querySelector('[data-k="book"]'), actSel = el.querySelector('[data-k="act"]');
  const fillActs = () => { const acts = actsOf(Number(bookSel.value)); actSel.innerHTML = acts.map((a) => `<option value="${a}">Act ${a}</option>`).join('') + `<option value="${acts[acts.length - 1] + 1}">A new act (${acts[acts.length - 1] + 1})</option>`; };
  bookSel.onchange = fillActs; fillActs();
  el.querySelector('[data-a="cancel"]').onclick = closeOverlay;
  el.querySelector('[data-a="make"]').onclick = async (ev) => {
    ev.target.disabled = true;
    const book = Number(bookSel.value), act = Number(actSel.value);
    const orders = S.chapters.filter((c) => c.book === book && c.act === act).map((c) => c.order);
    const now = new Date().toISOString();
    const row = { id: uuid(), user_id: userId, project_id: projectId, book, act, order: orders.length ? Math.max(...orders) + 1 : 0,
      title: el.querySelector('[data-k="title"]').value.trim() || 'Untitled chapter', status: 'idea', content: v ? v.content : '', notes: '',
      annotations: [], versions: [], updated_at: now };
    const { error } = await sb.from('chapters').insert(row);
    if (error) { ev.target.disabled = false; return alert(error.message); }
    const mark = { became_type: 'chapter', became_id: row.id, became_at: now };
    const { error: e2 } = await sb.from('treatments').update(mark).eq('id', t.id);
    if (e2) alert('The chapter was made, but the scene could not be marked: ' + e2.message);
    else Object.assign(t, mark);
    await sb.from('storyboard_events').update({ chapter_id: row.id }).eq('treatment_id', t.id);
    S.events.forEach((e) => { if (e.treatment_id === t.id) e.chapter_id = row.id; });
    S.chapters.push({ id: row.id, book, act, order: row.order, title: row.title });
    tellParent('chapters');
    closeOverlay(); go('write', { chapter: row.id });
  };
}

/* ====================================================================== JOURNAL */
// The writing journal (2026-10-27): the writer's own diary of making the saga, kept in the
// project. Pages made here are free canvases; pages SCANNED from the paper notebook are stored as
// photographs of the page, straightened and otherwise exactly as written. How a page is drawn and
// edited, and the scanner, live in journal/journal-kit.js -- shared with the phone. This section
// is the studio's half: the notebook, the palette, saving.
const JK = window.JournalKit;
const J = { pages: [], current: null, selected: null, missing: false, palette: 'kit', saveTimers: new Map(), uploads: null, projectQuery: '' };

async function loadJournal(){
  const { data, error } = await sb.from('journal_pages').select('*').eq('project_id', projectId);
  J.missing = !!error;
  J.pages = (data || []).map((p) => ({ ...p, items: Array.isArray(p.items) ? p.items : [] }))
    .sort((a, b) => String(a.day).localeCompare(String(b.day)) || Number(a.position) - Number(b.position));
}
const jPage = (id) => J.pages.find((p) => p.id === id);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

// Pictures in either private bucket, through signed links cached for most of their hour.
const bucketCache = {};
async function bucketUrl(bucket, path){
  if (!path) return null;
  if (bucket === 'character-images') return imageUrl(path);
  const k = bucket + ':' + path;
  if (bucketCache[k]) return bucketCache[k];
  const { data } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (data) { bucketCache[k] = data.signedUrl; setTimeout(() => delete bucketCache[k], 50 * 60 * 1000); }
  return data ? data.signedUrl : null;
}

function saveJournalPage(page, fields = ['items']){
  clearTimeout(J.saveTimers.get(page.id));
  const st = $('#jr-status'); if (st) st.textContent = 'Saving…';
  J.saveTimers.set(page.id, setTimeout(async () => {
    const patch = { updated_at: new Date().toISOString() };
    for (const f of fields) patch[f] = page[f];
    const { error } = await sb.from('journal_pages').update(patch).eq('id', page.id);
    const s2 = $('#jr-status'); if (s2) s2.textContent = error ? 'Not saved: ' + error.message : 'Saved';
  }, 700));
}

async function newJournalPage(fields = {}){
  const last = J.pages[J.pages.length - 1];
  const page = { id: uuid(), user_id: userId, project_id: projectId, day: todayISO(), title: '', paper: last ? last.paper : 'lined', scan_path: null, items: [], position: positionBetween(last ? Number(last.position) : null, null), ...fields };
  const { error } = await sb.from('journal_pages').insert(page);
  if (error) { alert(error.message); return null; }
  J.pages.push(page);
  J.pages.sort((a, b) => String(a.day).localeCompare(String(b.day)) || Number(a.position) - Number(b.position));
  return page;
}

async function renderJournal(){
  await loadJournal();
  if (J.missing) { view.innerHTML = '<div class="note-msg">The journal needs supabase/migrations/20261027_journal.sql pasted into the Supabase SQL editor once.</div>'; return; }
  if (!jPage(J.current)) J.current = J.pages[J.pages.length - 1]?.id ?? null;
  view.innerHTML = `<div class="jr">
    <div class="jr-side"><div class="jr-side-top"><button class="btn solid" id="jr-new">+ New page</button><button class="btn gold" id="jr-scan">Scan pages</button></div><div class="jr-list" id="jr-list"></div></div>
    <div class="jr-main"><div class="jr-bar" id="jr-bar"></div><div class="jr-desk" id="jr-desk"></div></div>
    <div class="jr-palette" id="jr-palette"></div>
    <div class="jr-scanner" id="jr-scanner" hidden></div>
  </div>`;
  $('#jr-new').onclick = async () => { const p = await newJournalPage(); if (p) { J.current = p.id; J.selected = null; drawJournal(); } };
  $('#jr-scan').onclick = scanPages;
  JK.attach($('#jr-desk'), {
    pageOf: jPage,
    selected: () => J.selected,
    onSelect: (pageId, itemId) => {
      const changedPage = J.current !== pageId;
      J.current = pageId; J.selected = itemId ? { page: pageId, item: itemId } : null;
      if (changedPage) drawJournal(); else drawDesk();
    },
    onChange: (pageId) => { const p = jPage(pageId); if (p) saveJournalPage(p); drawDesk(); },
    onTyping: (pageId) => { const p = jPage(pageId); if (p) saveJournalPage(p); },
    onEditText: (pageId, itemId) => {
      const p = jPage(pageId); const it = p.items.find((x) => x.id === itemId);
      if (it.kind !== 'stamp' && it.kind !== 'cutout') return;
      const v = prompt(it.kind === 'stamp' ? 'Stamp text' : 'Cutout text', it.text || ''); if (v == null) return;
      it.text = it.kind === 'stamp' && it.shape !== 'letters' ? v.toUpperCase() : v;
      saveJournalPage(p); drawDesk();
    },
  });
  drawJournal();
  drawPalette();
}

function drawJournal(){
  const list = $('#jr-list'); if (!list) return;
  list.innerHTML = [...J.pages].reverse().map((p) => `<button class="item ${p.id === J.current ? 'on' : ''}" data-id="${p.id}"><div class="tt">${esc(p.title || JK.dayLabel(p.day))}</div><div class="tg">${p.title ? JK.dayLabel(p.day) + ' · ' : ''}${p.scan_path ? 'scanned' : `${p.items.length} thing${p.items.length === 1 ? '' : 's'} on it`}</div></button>`).join('') || '<p class="note-msg">No pages yet. Start one, or scan the notebook.</p>';
  list.onclick = (e) => { const b = e.target.closest('[data-id]'); if (!b) return; J.current = b.dataset.id; J.selected = null; drawJournal(); };
  const page = jPage(J.current);
  const bar = $('#jr-bar');
  bar.innerHTML = page ? `
    <input type="date" id="jr-day" value="${esc(String(page.day).slice(0, 10))}">
    <input id="jr-title" placeholder="A title, if it wants one" value="${esc(page.title)}">
    ${page.scan_path ? '<span class="status">Scanned page</span>' : `<select id="jr-paper">${Object.entries(JK.KIT.papers).map(([k, v]) => `<option value="${k}" ${page.paper === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`}
    <span id="jr-sel"></span><span style="flex:1"></span><span class="status" id="jr-status"></span>
    <button class="btn danger" id="jr-del">Delete page</button>` : '';
  if (page) {
    $('#jr-day').onchange = (e) => { page.day = e.target.value || page.day; saveJournalPage(page, ['day']); J.pages.sort((a, b) => String(a.day).localeCompare(String(b.day)) || Number(a.position) - Number(b.position)); drawJournal(); };
    $('#jr-title').oninput = (e) => { page.title = e.target.value; saveJournalPage(page, ['title']); const it = document.querySelector(`#jr-list [data-id="${page.id}"] .tt`); if (it) it.textContent = page.title || JK.dayLabel(page.day); };
    const paper = $('#jr-paper'); if (paper) paper.onchange = (e) => { page.paper = e.target.value; saveJournalPage(page, ['paper']); drawDesk(); };
    $('#jr-del').onclick = async () => {
      if (!confirm('Move this page to the Trash? It can be restored from Trash on the phone.')) return;
      const { error } = await sb.from('trash').insert({ user_id: userId, project_id: projectId, type: 'journal_page', payload: { page }, deleted_at: new Date().toISOString() });
      if (error) return alert(error.code === '23514' ? 'The trash does not accept journal pages yet: paste supabase/migrations/20261027_journal.sql once. The page has not been touched.' : error.message);
      await sb.from('journal_pages').delete().eq('id', page.id);
      J.pages = J.pages.filter((p) => p !== page); J.current = J.pages[J.pages.length - 1]?.id ?? null; J.selected = null; drawJournal();
    };
  }
  drawDesk();
}

// The open notebook: the page before on the left, the current page on the right. Both editable.
function drawDesk(){
  const desk = $('#jr-desk'); if (!desk) return;
  const i = J.pages.findIndex((p) => p.id === J.current);
  if (i < 0) { desk.innerHTML = '<div class="jr-empty">Start a page with + New page, or scan the notebook.</div>'; drawSelectionBar(); return; }
  const left = J.pages[i - 1], right = J.pages[i];
  const pageW = Math.max(160, Math.min((desk.clientWidth - 70) / 2, (desk.clientHeight - 50) / 1.4, 560));
  const s = pageW / JK.JW;
  const slot = (p, side) => `<div class="jr-page ${side}${p ? '' : ' blank'}" style="width:${pageW}px;height:${pageW * 1.4}px"><div class="jk-sheet paper-plain" ${p ? `data-page="${p.id}"` : ''} style="transform:scale(${s})"></div></div>`;
  desk.innerHTML = `<div class="jr-book">${slot(left, 'left')}${slot(right, 'right')}<span class="jr-ring"></span></div>`;
  const sheets = desk.querySelectorAll('.jk-sheet[data-page]');
  sheets.forEach((sheet) => JK.renderSheet(sheet, jPage(sheet.dataset.page), { selectedId: J.selected?.item, urlFor: bucketUrl }));
  sheets.forEach((sheet) => { sheet.style.transform = `scale(${s})`; });
  drawSelectionBar();
}

function selectedItem(){
  if (!J.selected) return null;
  const page = jPage(J.selected.page); const it = page?.items.find((x) => x.id === J.selected.item);
  return it ? { page, it } : null;
}
function drawSelectionBar(){
  const el = $('#jr-sel'); if (!el) return;
  const sel = selectedItem();
  if (!sel) { el.innerHTML = '<span class="status">Click a thing to move it; double-click text to write.</span>'; return; }
  const { it } = sel;
  const colors = it.kind === 'tape' ? JK.KIT.tapeColors : JK.KIT.inks;
  el.innerHTML = `<span class="jr-tools">
    ${['text', 'stamp', 'tape'].includes(it.kind) ? colors.map((c) => `<button class="sw-b ${it.color === c ? 'on' : ''}" data-color="${c}" style="background:${c}"></button>`).join('') : ''}
    ${it.kind === 'text' ? `<select data-k="font">${Object.entries(JK.KIT.fonts).map(([k, [, label]]) => `<option value="${k}" ${it.font === k ? 'selected' : ''}>${label}</option>`).join('')}</select>
      <button class="btn" data-act="smaller">A−</button><button class="btn" data-act="bigger">A+</button>` : ''}
    ${it.kind === 'tape' ? `<select data-k="pattern">${JK.KIT.tapePatterns.map((p) => `<option ${it.pattern === p ? 'selected' : ''}>${p}</option>`).join('')}</select>` : ''}
    ${it.kind === 'image' ? `<select data-k="edge">${['deckle', 'torn', 'straight'].map((p) => `<option ${it.edge === p ? 'selected' : ''}>${p}</option>`).join('')}</select>` : ''}
    <button class="btn" data-act="front" title="Bring to front">⬆</button><button class="btn" data-act="back" title="Send to back">⬇</button>
    <button class="btn" data-act="dup" title="Duplicate">⧉</button><button class="btn danger" data-act="del" title="Take it off the page">✕</button></span>`;
  el.onclick = (ev) => {
    const b = ev.target.closest('[data-color],[data-act]'); if (!b) return;
    const cur = selectedItem(); if (!cur) return; const { page, it: x } = cur;
    if (b.dataset.color) x.color = b.dataset.color;
    const act = b.dataset.act;
    if (act === 'bigger') x.size = Math.round((x.size || 30) * 1.15);
    if (act === 'smaller') x.size = Math.max(10, Math.round((x.size || 30) / 1.15));
    if (act === 'front') x.z = Math.max(0, ...page.items.map((i) => i.z || 0)) + 1;
    if (act === 'back') x.z = Math.min(0, ...page.items.map((i) => i.z || 0)) - 1;
    if (act === 'dup') { const c = { ...x, id: JK.uid(), x: x.x + 18, y: x.y + 18, z: Math.max(0, ...page.items.map((i) => i.z || 0)) + 1 }; page.items.push(c); J.selected = { page: page.id, item: c.id }; }
    if (act === 'del') { page.items = page.items.filter((i) => i !== x); J.selected = null; }
    saveJournalPage(page); drawDesk(); countOnList(page);
  };
  el.onchange = (ev) => { const k = ev.target.dataset.k; const cur = selectedItem(); if (!k || !cur) return; cur.it[k] = ev.target.value; saveJournalPage(cur.page); drawDesk(); };
}
function countOnList(p){ const el = document.querySelector(`#jr-list [data-id="${p.id}"] .tg`); if (el) el.textContent = `${p.title ? JK.dayLabel(p.day) + ' · ' : ''}${p.scan_path ? 'scanned' : `${p.items.length} thing${p.items.length === 1 ? '' : 's'} on it`}`; }
document.addEventListener('keydown', (ev) => {
  if (tab !== 'journal' || !J.selected) return;
  if (ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (ev.key === 'Delete' || ev.key === 'Backspace') { const cur = selectedItem(); if (!cur) return; cur.page.items = cur.page.items.filter((i) => i !== cur.it); J.selected = null; saveJournalPage(cur.page); drawDesk(); countOnList(cur.page); ev.preventDefault(); }
  if (ev.key === 'Escape') { J.selected = null; drawDesk(); }
});

async function uploadJournalPictures(){
  const files = await pickFile('image/*', true);
  for (const file of files) {
    const ext = (file.name.split('.').pop() || 'png').toLowerCase();
    const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
    const { error } = await sb.storage.from('journal-images').upload(path, file, { contentType: file.type || 'image/' + ext });
    if (error) { alert(/bucket/i.test(error.message) ? 'The journal\'s picture store needs supabase/migrations/20261027_journal.sql run once.' : error.message); return; }
  }
  J.uploads = null; drawPalette();
}

// ---- scanning the paper notebook ---------------------------------------------------------
// Each photograph goes through the scanner (corners, rotation, a spread split at the binding);
// each page that comes out is stored as it is and becomes a journal page dated today -- the date
// can be changed in the bar. Nothing is read off the page or rewritten.
async function scanPages(){
  const files = await pickFile('image/*', true);
  if (!files.length) return;
  const host = $('#jr-scanner');
  let made = 0;
  for (const file of files) {
    const url = URL.createObjectURL(file);
    host.hidden = false;
    const results = await new Promise((resolve) => JK.openScanner(host, url, { onDone: resolve, onCancel: () => resolve(null) }));
    URL.revokeObjectURL(url);
    if (!results) continue;
    for (const r of results) {
      const blob = await (await fetch(r.dataUrl)).blob();
      const path = `${userId}/scan-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error } = await sb.storage.from('journal-images').upload(path, blob, { contentType: 'image/jpeg' });
      if (error) { host.hidden = true; host.innerHTML = ''; alert(/bucket/i.test(error.message) ? 'Scanning needs supabase/migrations/20261027_journal.sql run once.' : error.message); return; }
      const page = await newJournalPage({ scan_path: path, paper: 'plain' });
      if (page) { J.current = page.id; made++; }
    }
  }
  host.hidden = true; host.innerHTML = '';
  J.selected = null; drawJournal();
  if (made) $('#jr-status').textContent = `${made} page${made === 1 ? '' : 's'} scanned in`;
}
window.addEventListener('resize', () => { if (tab === 'journal') drawDesk(); });

/* ====================================================================== routing */
async function go(next, opts = {}){
  if (tab === 'write' && next !== 'write' && !(await flushWrite()) && !confirm('A chapter could not be saved — it was changed somewhere else. Leave the Writer anyway?')) return;
  tab = next;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  history.replaceState(null, '', `?project=${projectId}&tab=${tab}`);
  view.innerHTML = '<div class="note-msg">Loading…</div>';
  try {
    if (tab === 'write') await renderWrite(opts);
    else if (tab === 'journal') await renderJournal();
    else if (tab === 'storyboard') await renderStoryboard(opts);
    else if (tab === 'sketches') await renderSketches(opts);
    else if (tab === 'characters') await renderCharacters(opts);
    else await renderDocuments(opts);
  } catch (e) {
    view.innerHTML = `<div class="note-msg">${esc(e.message || String(e))}${/storyboard/.test(e.message || '') ? '<br>The storyboard needs supabase/migrations/20260924_storyboard.sql.' : ''}</div>`;
  }
}
document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => go(b.dataset.tab)));
window.addEventListener('resize', () => { if (tab === 'storyboard' && $('#wall')) drawStoryboard(); });
go(tab, startOpts);
})();
</script>
