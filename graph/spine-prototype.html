erties":{"chapter_id":"ch:4","order":4,"act":1,"pov":"Nakulan","pov_character_id":"c:nakulan","summary":"First ambiguous incident; introduce the damaged portrait; escalate household unease without yet confirming anything supernatural.","ends_on":"Valyammai discovering the disturbed lock, saying nothing to anyone yet."}},{"id":"e:5","label":"WHAT THE PUJA COULDN'T FIX","type":"event","needsReview":false,"participants":1,"seq":5,"properties":{"chapter_id":"ch:5","order":5,"act":1,"pov":"Nakulan","pov_character_id":"c:nakulan","summary":"First real violence; crystallize the family's fear into open supernatural belief; end Act One on the decision to summon outside help.","ends_on":"Nakulan on the phone, asking Sunny to come immediately. **End of Act One.**"}},{"id":"e:6","label":"THE MAN FROM AMERICA","type":"event","needsReview":false,"participants":4,"seq":6,"properties":{"chapter_id":"ch:6","order":6,"act":2,"pov":"Sunny","pov_character_id":"c:sunny","summary":"Introduce Sunny at full voice; establish his method; the Alli assault incident and Mahadevan's wrongful suspicion.","ends_on":"Sunny asking, mildly, whether anyone actually saw what happened, and getting no clear answer."}},{"id":"e:7","label":"MIDNIGHT IN THE THEKKINI","type":"event","needsReview":false,"participants":2,"seq":7,"properties":{"chapter_id":"ch:7","order":7,"act":2,"pov":"Sunny","pov_character_id":"c:sunny","summary":"The book's most overtly \"haunted\" set piece, staged so it can be reread as clinical once the reader knows the truth; the Durgashtami threat is issued.","ends_on":"Sunny alone in the corridor afterward, no longer treating this as a straightforward case."}},{"id":"e:8","label":"LOCKED IN HER OWN ROOM","type":"event","needsReview":false,"participants":3,"seq":8,"properties":{"chapter_id":"ch:8","order":8,"act":2,"pov":"Sridevi","pov_character_id":"c:sridevi","summary":"The poisoning subplot; Sridevi wrongly confined; establish this incident as mundane and separate from the dissociative pattern (per Story Bible §3).","ends_on":"Sridevi, alone, starting her notes with the sentence: \"I did not do this.\""}},{"id":"e:9","label":"WHAT EVOOR REMEMBERS","type":"event","needsReview":false,"participants":1,"seq":9,"properties":{"chapter_id":"ch:9","order":9,"act":2,"pov":"Sunny","pov_character_id":"c:sunny","summary":"Fracture the legend; deliver the true 150-year-old history to both Sunny and the reader; deepen the thematic spine.","ends_on":"Sunny, on the road back, asking himself who in the household could possibly know these specific, unrecorded details."}},{"id":"e:10","label":"THE DIAGNOSIS","type":"event","needsReview":false,"participants":2,"seq":10,"properties":{"chapter_id":"ch:10","order":10,"act":2,"pov":"Sunny","pov_character_id":"c:sunny","summary":"Sunny reaches the correct diagnosis privately; confides in Sridevi; the melancholy red herring is debunked; the true nature of Ganga's condition is laid out fully for the reader.","ends_on":"Sunny's realization that a clinical diagnosis alone will save no one — the family will never accept it on its own terms."}},{"id":"e:11","label":"WHAT SRIDEVI KNEW","type":"event","needsReview":false,"participants":2,"seq":11,"properties":{"chapter_id":"ch:11","order":11,"act":2,"pov":"Sridevi","pov_character_id":"c:sridevi","summary":"Public vindication; the elders summon the Namboodiri, setting up Act Three.","ends_on":"The Namboodiri's palanquin/car arriving at the gate. **End of Act Two.**"}},{"id":"e:12","label":"TWO TRADITIONS, ONE PLAN","type":"event","needsReview":false,"participants":2,"seq":12,"properties":{"chapter_id":"ch:12","order":12,"act":3,"pov":"Sunny","pov_character_id":"c:sunny","summary":"The book's thematic centerpiece — Sunny and the Namboodiri's collaboration, worked out in full.","ends_on":"The Namboodiri's blessing of the plan, in ritual language that means something different to him than it does to Sunny — and both of them fine with that."}},{"id":"e:13","label":"THE NIGHT BEFOR bi","type":"other","valence":"ambiguous","description":"No relationship in life — they are separated by a hundred and fifty years. But Ganga’s alter casts Nakulan as the Karanavar, so he inherits a role he never asked for and cannot argue his way out of.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i25","from":"c:mahadevan","to":"c:ramanathan","type":"other","valence":"ambiguous","description":"Mahadevan is the real-world trigger the “Ramanathan” projection latches onto. Nothing about him invites it; proximity and the wrong moment are enough.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i21","from":"c:nagavalli","to":"c:ramanathan","type":"romantic","valence":"positive","description":"Partners for two years before the Karanavar bought her out of the Thanjavur court, and again in secret at Madampalli. Careful, and eventually not careful enough. Ch 0 gives them the book’s only true account of what they were to each other, so every later retelling of the legend reads against it.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i22","from":"c:nagavalli","to":"c:thambi","type":"betrayal","valence":"negative","description":"He did not kill her in a rage. Ch 0 is explicit that he arrived having already decided the shape of the evening and simply walked through its stages — which is what the family legend spends a century and a half softening into something more bearable.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i23","from":"c:ramanathan","to":"c:thambi","type":"betrayal","valence":"negative","description":"Killed first, and separately, at the cottage. The order matters: the Karanavar went to him before he went to her, methodically, which is the detail the sanitised family version loses.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i10","from":"c:nakulan","to":"c:sunny","type":"alliance","valence":"positive","description":"old, easy friendship; the reason he came at all.","eventId":"e:2","eventLabel":"FAR-AWAY MOODS","seq":2,"needsReview":false},{"id":"i6","from":"c:ganga","to":"c:alli","type":"other","valence":"ambiguous","description":"enabler, then unwitting near-victim of her.","eventId":"e:3","eventLabel":"THE KEY","seq":3,"needsReview":true},{"id":"i8","from":"c:ganga","to":"c:mahadevan","type":"confrontation","valence":"ambiguous","description":"Read by the household as harassment and by Ganga’s alter as recognition. Both readings are wrong, and the family acts on theirs — which is what puts Mahadevan under suspicion.","eventId":"e:6","eventLabel":"THE MAN FROM AMERICA","seq":6,"needsReview":true},{"id":"i19","from":"c:mahadevan","to":"c:elders","type":"confrontation","valence":"negative","description":"The elders turn on him quickly and completely, on no evidence, because a culprit is easier to hold than an explanation.","eventId":"e:6","eventLabel":"THE MAN FROM AMERICA","seq":6,"needsReview":true},{"id":"i3","from":"c:ganga","to":"c:sunny","type":"alliance","valence":"positive","description":"trusts him instinctively before either of them knows why; this should read, in hindsight, as the alter recognizing an ally.","eventId":"e:7","eventLabel":"MIDNIGHT IN THE THEKKINI","seq":7,"needsReview":false},{"id":"i7","from":"c:ganga","to":"c:alli","type":"confrontation","valence":"negative","description":"The “attack” on Alli, which is a dissociative episode misdirected rather than an assault. Alli helped her open the Thekkini in Ch 3 and is repaid by being the nearest body when the episode breaks.","eventId":"e:8","eventLabel":"LOCKED IN HER OWN ROOM","seq":8,"needsReview":false},{"id":"i4","from":"c:ganga","to":"c:sunny","type":"mentorship","valence":"ambiguous","description":"Sunny reaches the correct diagnosis and decides not to say it aloud yet. The hardest part of his arc is not the diagnosis; it is choosing to build the cure inside the family’s belief system rather than against it.","eventId":"e:10","eventLabel":"THE DIAGNOSIS","seq":10,"needsReview":true},{"id":"i13","from":"c:sunny","to":"c:sridevi","type":"alliance","valence":"positive","description":"the book's central non-romantic-coded-until-suddenly-it-is relationship; built on being taken seriously by someone for the first time in the story.","eventId":"e:11","eventLabel":"WHAT SRIDEVI KNEW","seq":11,"needsReview":false},{"id":"i15","from":"c:sunny","to":"c:namboodiri","type":"alliance","valence":"ambiguous","description":"The book’s thesis in one conversation. The Namboodiri never concedes that Sunny is right; he simply builds his ritual around Sunny’s plan and lets both traditions claim the result.","eventId":"e:12","eventLabel":"TWO TRADITIONS, ONE PLAN","seq":12,"needsReview":false},{"id":"i1","from":"c:ganga","to":"c:nakulan","type":"confrontation","valence":"negative","description":"The alter takes over fully and recasts her husband as the man who killed her. The text should read this as tragic rather than symbolic — she is not really angry at Nakulan, the substrate trauma simply needed a face, and his was the one available.","eventId":"e:13","eventLabel":"THE NIGHT BEFORE","seq":13,"needsReview":true},{"id":"i20","from":"c:namboodiri","to":"c:elders","type":"alliance","valence":"positive","description":"His blessing is what lets the family accept the outcome without ever being told the clinical truth. The vessel a truth arrives in matters as much as the truth.","eventId":"e:14","eventLabel":"DURGASHTAMI","seq":14,"needsReview":false},{"id":"i12","from":"c:sunny","to":"c:sridevi","type":"romantic","valence":"positive","description":"He proposes. It should read as earned rather than tacked on — built across several small scenes of two people doing careful work together while everyone around them reacts.","eventId":"e:16","eventLabel":"WHAT GANGA REMEMBERS","seq":16,"needsReview":false}],"flags":[{"id":"pr-24-p0","type":"plant","text":"She kept, in a box she told no one about, a single dried jasmine flower from the first night he had told her, plainly, without performance, that he loved her","label":"Never returned to, anywhere in the manuscript.","pairs":[{"id":"pr-24","label":"The dried jasmine flower"}],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:0","seq":0},{"id":"pr-01-p0","type":"plant","text":"There was no negotiation in the way stories would later tell it. There was a price, and a party who received it, and Nagavalli was not that party.","label":"The transaction stated plainly, in the only chapter with no family legend layered over it.","pairs":[{"id":"pr-01","label":"Nagavalli was purchased, not courted"}],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:0","seq":0},{"id":"thread-the-woman-taken-0","type":"note","text":"she was being described in the same conversations as the horses and the silverware","label":"Sita, Persephone, Helen — the abducted woman whose story is told by everyone except her. Ch 0 exists to give her the telling back.","pairs":[],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":null,"thread":"The woman taken","characterId":"c:nagavalli","eventId":"e:0","seq":0},{"id":"pr-02-p0","type":"plant","text":"that he had gone to Ramanathan with the particular unhurried calm of a man who has already decided the shape of the evening and is merely walking through its stages, that there had been no shouting, no crime of passion in the way the word suggested a loss of control, only a decision, executed.","label":"The cottage first, and the calm of a man walking through stages he has already decided.","pairs":[{"id":"pr-02","label":"Sequential, methodical murders — not one crime of passion"}],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:0","seq":0},{"id":"pr-25-p0","type":"plant","text":"The anklets were still on the floor of the Thekkini three days later","label":"Set down where they fell, and left there for a century and a half.","pairs":[{"id":"pr-25","label":"The anklets, the mirror, the lamp"}],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:0","seq":0},{"id":"note-ch0","type":"note","text":"No one, in the century and a half that followed, ever quite managed to think of a reason they should be moved, and so they stayed exactly where they had fallen, gathering dust in a room nobody entered, waiting — if a pair of anklets can be said to wait for anything — for someone to finally ask the right question about what, precisely, had happened in this house, and to whom, and why the answer the family told itself at dinner had never once included the word *bought*.","label":"Ends on: The anklets, still.","pairs":[],"chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","sceneId":"s:0:4","thread":null,"characterId":null,"eventId":"e:0","seq":0},{"id":"thread-the-forbidden-chamber-0","type":"note","text":"The keys held, always, by the household's eldest, never touched, never spoken of lightly.","label":"Bluebeard, Pandora, Lot’s wife: the room that must not be opened, and the certainty that it will be. The prohibition is the plot.","pairs":[],"chapterId":"ch:1","chapterTitle":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","sceneId":null,"thread":"The forbidden chamber","characterId":"c:ganga","eventId":"e:1","seq":1},{"id":"pr-22-p0","type":"plant","text":"\"You will not go near that door,\" Valyammai said","label":"The prohibition, delivered to the room and aimed at one person in it.","pairs":[{"id":"pr-22","label":"The locked door, and Valyammai's warning"}],"chapterId":"ch:1","chapterTitle":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","sceneId":null,"thread":null,"characterId":null,"eventId":"e:1","seq":1},{"id":"pr-03-p0","type":"plant","text":"he knew this only because Ganga's slippers, left neatly by the door the night before, were faintly, inexplicably, dusty.","label":"She has already walked the gallery, before anyone thinks the keys are missing.","pairs":[{"id":"pr-03","label":"Ganga's dusty slippers, night one"}],"chapterId":"ch:1","chapterTitle":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","sceneId":null,"thread":null,"characterId":null,"eventId":"e:1","seq":1},{"id":"pr-04-p0","type":"plant","text":"that half-second delay, the eyes catching up to the face a beat after the face had already begun to smile.","label":"The first visible trace of the alter, dressed as tiredness.","pairs":[{"id":"pr-04","label":"Ganga's far-away lapses"}],"chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:2","seq":2},{"id":"pr-05-p0","type":"plant","text":"Ganga's hand moved, without her seeming to notice it moving, to rest flat against her stomach","label":"The undisclosed grief, gestured at and never named.","pairs":[{"id":"pr-05","label":"The hand on the stomach"}],"chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:2","seq":2},{"id":"pr-06-p0","type":"plant","text":"You know I did my residency partly on a dissociative disorders ward. Nothing scares me anymore.","label":"The diagnosis is in his mouth in Chapter 2, as a joke, eight chapters before he means it.","pairs":[{"id":"pr-06","label":"Sunny's dissociative-ward joke"}],"chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:2","seq":2},{"id":"note-ch2","type":"note","text":"He did not yet know how soon he would be asking Sunny the same question again, in person, with considerably less room left for easy explanations.","label":"Ends on: Ganga's hand, briefly, resting on her own stomach without seeming to notice she's done it.","pairs":[],"chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","sceneId":"s:2:3","thread":null,"characterId":null,"eventId":"e:2","seq":2},{"id":"pr-09-p0","type":"plant","text":"Sridevi noticed things. It was not a virtue she had cultivated so much as a habit she had backed into, the way a person backs into a corner of a crowded room without deciding to — she had grown up slightly to the side of this family's attention, close enough to be included, never quite close enough to be the center of anything, and a person in that position learns, without meaning to, to watch.","label":"Established as temperament long before it becomes useful.","pairs":[{"id":"pr-09","label":"Sridevi's habit of quiet observation"}],"chapterId":"ch:3","chapterTitle":"THE KEY","sceneId":null,"thread":null,"characterId":null,"eventId":"e:3","seq":3},{"id":"pr-25-p1","type":"plant","text":"a cracked mirror that had lost most of its silvering, and, near the foot of the bed, a pair of anklets, tarnished black","label":"Seen again, close up — and then not used.","pairs":[{"id":"pr-25","label":"The anklets, the mirror, the lamp"}],"chapterId":"ch:3","chapterTitle":"THE KEY","sceneId":null,"thread":null,"characterId":null,"eventId":"e:3","seq":3},{"id":"pr-07-p0","type":"plant","text":"heard her say something under her breath. A few words, low, in a cadence that was almost but not quite the Tamil the household used, the accent slightly wrong","label":"A language learned by ear rather than lived in — the tell that it was performed at her, not inherited.","pairs":[{"id":"pr-07","label":"The unfamiliar Tamil phrase"}],"chapterId":"ch:3","chapterTitle":"THE KEY","sceneId":null,"thread":null,"characterId":null,"eventId":"e:3","seq":3},{"id":"pr-08-p0","type":"plant","text":"G. said something in the Thekkini. Not sure what. Didn't sound like her.","label":"The record begins the day of the key theft, before anyone knows there is anything to record.","pairs":[{"id":"pr-08","label":"Sridevi's first notebook entry"}],"chapterId":"ch:3","chapterTitle":"THE KEY","sceneId":null,"thread":null,"characterId":null,"eventId":"e:3","seq":3},{"id":"pr-26-p0","type":"plant","text":"a long diagonal slash through the painted hands, crudely repaired with backing cloth that had itself gone dark with age.","label":"The slash goes through the hands specifically. Ch 9's true history never reconnects to the image.","pairs":[{"id":"pr-26","label":"The damaged ancestor portrait"}],"chapterId":"ch:4","chapterTitle":"THE EYES THAT FOLLOW","sceneId":null,"thread":null,"characterId":null,"eventId":"e:4","seq":4},{"id":"pr-10-p0","type":"plant","text":"A tumbler on the dining table, standing undisturbed, no one within arm's reach, simply — cracked, cleanly","label":"The first breakage, with a perfectly reasonable explanation already attached to it.","pairs":[{"id":"pr-10","label":"Objects shattering with no clear cause"}],"chapterId":"ch:4","chapterTitle":"THE EYES THAT FOLLOW","sceneId":null,"thread":null,"characterId":null,"eventId":"e:4","seq":4},{"id":"note-ch4","type":"note","text":"She only looked at the small lamp, and let it burn, and did not go to bed until it had.","label":"Ends on: Valyammai discovering the disturbed lock, saying nothing to anyone yet.","pairs":[],"chapterId":"ch:4","chapterTitle":"THE EYES THAT FOLLOW","sceneId":"s:4:3","thread":null,"characterId":null,"eventId":"e:4","seq":4},{"id":"thread-the-forbidden-chamber-1","type":"note","text":"It's opened,","label":"The motif completes the moment the door gives. Everything after is consequence, which is how the forbidden-chamber story always runs.","pairs":[],"chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","sceneId":null,"thread":"The forbidden chamber","characterId":"c:ganga","eventId":"e:5","seq":5},{"id":"pr-23-p0","type":"plant","text":"The rite ended without incident, which should have been a relief and instead only deepened the unease in the room — a ritual that produces no visible effect is, to a frightened household, not evidence of nothing happening but evidence that whatever is happening is stronger than the tools they have to address it.","label":"Tradition alone, and it does nothing.","pairs":[{"id":"pr-23","label":"The failed puja against the designed rite"}],"chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","sceneId":null,"thread":null,"characterId":null,"eventId":"e:5","seq":5},{"id":"pr-12-p0","type":"plant","text":"Ganga, standing near the shrine room's lamps, her saree already alight along one edge, moving — not screaming, not panicking, moving with a strange deliberate slowness","label":"Deliberate slowness where panic belongs — the detail that makes it a state, not an attack.","pairs":[{"id":"pr-12","label":"The saree fire"}],"chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","sceneId":null,"thread":null,"characterId":null,"eventId":"e:5","seq":5},{"id":"pr-11-p0","type":"plant","text":"watched it land first, uncertainly, on his own wife, a dozen frightened eyes finding her and flinching away again as though the accusation were too large to actually hold in place — and then, in the scramble to find somewhere safer to put it, watched it swing instead toward Sridevi","label":"The accusation looking for somewhere safer to land.","pairs":[{"id":"pr-11","label":"\"Possessed\" — spoken, then redirected to Sridevi"}],"chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","sceneId":null,"thread":null,"characterId":null,"eventId":"e:5","seq":5},{"id":"note-ch5","type":"note","text":"Nakulan hung up and stood alone in the dark corridor for a long moment, the smell of smoke still faint in the air, and did not yet know how much the shape of the coming days would owe to a promise made half-asleep, across an ocean, by a man who had no idea yet just how strange the truth was going to turn out to be.","label":"Ends on: Nakulan on the phone, asking Sunny to come immediately. **End of Act One.**","pairs":[],"chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","sceneId":"s:5:4","thread":null,"characterId":null,"eventId":"e:5","seq":5},{"id":"pr-09-r1","type":"reveal","text":"You have the look of someone who writes things down.","label":"Sunny reads it off her in one line, which is how he ends up with a corroborating witness.","pairs":[{"id":"pr-09","label":"Sridevi's habit of quiet observation"}],"chapterId":"ch:6","chapterTitle":"THE MAN FROM AMERICA","sceneId":null,"thread":null,"characterId":null,"eventId":"e:6","seq":6},{"id":"pr-13-p0","type":"plant","text":"He noted that Mahadevan, kneeling several feet away, had both hands empty and neither sleeve so much as creased.","label":"The physical evidence nobody else in that corridor is looking at.","pairs":[{"id":"pr-13","label":"Mahadevan's clean hands"},{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:6","chapterTitle":"THE MAN FROM AMERICA","sceneId":null,"thread":null,"characterId":null,"eventId":"e:6","seq":6},{"id":"note-ch6","type":"note","text":"Mahadevan caught Sunny's eye once, on his way past, a look that was half gratitude for the postponement and half genuine bewilderment, and Sunny gave him nothing back but a small, noncommittal nod — not yet an alliance, not yet a dismissal, just a doctor filing away one more piece of a picture that was already, quietly, beginning to assemble itself into a shape he did not yet want to say out loud.","label":"Ends on: Sunny asking, mildly, whether anyone actually saw what happened, and getting no clear answer.","pairs":[],"chapterId":"ch:6","chapterTitle":"THE MAN FROM AMERICA","sceneId":"s:6:3","thread":null,"characterId":null,"eventId":"e:6","seq":6},{"id":"thread-the-goddess-and-the-demon-0","type":"note","text":"references to a betrayal, to a river of Thanjavur, to a man's hands.","label":"The register the alter sings in is devotional. It is building itself a myth to act inside, and it has cast the parts already.","pairs":[],"chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","sceneId":null,"thread":"The goddess and the demon","characterId":"c:ganga","eventId":"e:7","seq":7},{"id":"pr-14-p0","type":"plant","text":"details that made Sunny's clinical instincts sharpen even through the genuine unease crawling up his spine: precise turns of phrase, an intimacy with the geography of a court two hundred miles from here","label":"Accuracy no family retelling could carry.","pairs":[{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","sceneId":null,"thread":null,"characterId":null,"eventId":"e:7","seq":7},{"id":"pr-15-p0","type":"plant","text":"\"On Durgashtami,\" the voice said, when the account was finished, \"you will answer for it. I will finish what his hands began, and this time nothing will stop the blade.\"","label":"The deadline that structures the whole of Act Three.","pairs":[{"id":"pr-15","label":"The Durgashtami deadline"}],"chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","sceneId":null,"thread":null,"characterId":null,"eventId":"e:7","seq":7},{"id":"note-ch7","type":"note","text":"He was investigating a person.","label":"Ends on: Sunny alone in the corridor afterward, no longer treating this as a straightforward case.","pairs":[],"chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","sceneId":"s:7:3","thread":null,"characterId":null,"eventId":"e:7","seq":7},{"id":"pr-16-p0","type":"plant","text":"I did not do this,* she wrote, first, because she needed the sentence in her own handwriting where she could look at it.","label":"Written for herself, with no expectation that anyone will ever read it.","pairs":[{"id":"pr-16","label":"Sridevi's notebook opening line"}],"chapterId":"ch:8","chapterTitle":"LOCKED IN HER OWN ROOM","sceneId":null,"thread":null,"characterId":null,"eventId":"e:8","seq":8},{"id":"pr-27-p0","type":"plant","text":"the argument she'd overheard three days earlier between Achuthan Pillai and Nakulan's uncle over the quarterly accounts — a detail she had noted at the time only out of habit","label":"Story Bible §3 and the Continuity Timeline both specify this thread stays unresolved.","pairs":[{"id":"pr-27","label":"The accountant thread — contradicts the planning docs"}],"chapterId":"ch:8","chapterTitle":"LOCKED IN HER OWN ROOM","sceneId":null,"thread":null,"characterId":null,"eventId":"e:8","seq":8},{"id":"note-ch8","type":"note","text":"She only knew that she had been wronged, and that being wronged, this particular time, had given her something to do with her hands besides wait — and that whatever came next, she intended to have a record of everything, in her own words, ready the moment anyone finally cared to ask her what she'd actually seen.","label":"Ends on: Sridevi, alone, starting her notes with the sentence: \"I did not do this.\"","pairs":[],"chapterId":"ch:8","chapterTitle":"LOCKED IN HER OWN ROOM","sceneId":"s:8:3","thread":null,"characterId":null,"eventId":"e:8","seq":8},{"id":"pr-01-r1","type":"reveal","text":"It's not wrong, exactly. It's just missing the part where nobody asked her anything.","label":"Bhargavi Amma names what the family's version leaves out.","pairs":[{"id":"pr-01","label":"Nagavalli was purchased, not courted"}],"chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:9","seq":9},{"id":"thread-the-woman-taken-1","type":"note","text":"the transaction, not a courtship; Ramanathan already her partner before the Karanavar had ever laid eyes on her, not a seducer who stole her away","label":"Named outright, a century and a half later, by a stranger with no stake in the family’s version of it.","pairs":[],"chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","sceneId":null,"thread":"The woman taken","characterId":"c:nagavalli","eventId":"e:9","seq":9},{"id":"pr-02-r1","type":"reveal","text":"the murders themselves, described not as a single unified act of a man undone by passion but as two separate, sequential acts, the cottage first, methodical, and only afterward, drunk and unravelling, the Thekkini.","label":"The outside record confirms the order, which is the detail the legend sands off.","pairs":[{"id":"pr-02","label":"Sequential, methodical murders — not one crime of passion"}],"chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:9","seq":9},{"id":"pr-14-r1","type":"reveal","text":"Whoever, or whatever, was speaking from behind that locked door knew a version of the story the family itself did not know.","label":"Matched against the Evoor record — and it narrows the field of explanation rather than widening it.","pairs":[{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:9","seq":9},{"id":"note-ch9","type":"note","text":"But he had, for the first time since arriving at Madampalli, the shape of a question he actually knew how to ask, and he drove the rest of the way back in a silence that had nothing left of jetlag or performance in it at all.","label":"Ends on: Sunny, on the road back, asking himself who in the household could possibly know these specific, unrecorded details.","pairs":[],"chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","sceneId":"s:9:3","thread":null,"characterId":null,"eventId":"e:9","seq":9},{"id":"pr-10-r1","type":"reveal","text":"laying every fact he had out on the small writing desk in his room the way he'd once been trained to lay out a differential diagnosis — not in order of drama, but in order of evidence.","label":"Folded into the evidence list. Note: that paragraph never names the shattering objects — this payoff is structural, not stated.","pairs":[{"id":"pr-10","label":"Objects shattering with no clear cause"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-04-r1","type":"reveal","text":"Ganga's far-away moods, first noted by Nakulan before either of them had reason to think anything of it.","label":"Recognised as an early dissociative symptom rather than travel fatigue.","pairs":[{"id":"pr-04","label":"Ganga's far-away lapses"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-03-r1","type":"reveal","text":"The dust on her slippers, the very first morning, before the keys were even officially missing.","label":"Read back as evidence, in Sunny's differential.","pairs":[{"id":"pr-03","label":"Ganga's dusty slippers, night one"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-12-r1","type":"reveal","text":"The saree fire, which Ganga genuinely did not seem to remember, staged close enough to open flame that it read, on close honest examination, far more plausibly as an accident involving a person not fully present in her own body than as an attack by anything external.","label":"Confirmed as a dissociative-state accident.","pairs":[{"id":"pr-12","label":"The saree fire"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-13-r1","type":"reveal","text":"The Alli incident, where the physical evidence — Mahadevan's empty, uncreased hands — had never actually supported the accusation","label":"Stated outright: the household convicted him by proximity.","pairs":[{"id":"pr-13","label":"Mahadevan's clean hands"},{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-14-r2","type":"reveal","text":"a version, Sunny was now near certain, that could only have reached Ganga through an unusually thorough, unusually immersive childhood exposure","label":"The clinical conclusion drawn from it. (The supplied table lists this line under Ch 9; it is in Ch 10.)","pairs":[{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-07-r1","type":"reveal","text":"a grand-aunt on Ganga's side, now deceased, who had spent years steeped in Tamil court-dance history, who had — the cousin remembered this vividly, laughing slightly at the memory — used to perform the whole Nagavalli story for a young, rapt Ganga, in full costume","label":"Traced to the grand-aunt, in costume, again and again.","pairs":[{"id":"pr-07","label":"The unfamiliar Tamil phrase"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-06-r1","type":"reveal","text":"He wrote out the clinical picture in full, for his own clarity as much as anything: a Dissociative Identity Disorder","label":"The joke, made seriously.","pairs":[{"id":"pr-06","label":"Sunny's dissociative-ward joke"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-08-r1","type":"reveal","text":"she reached for her notebook and turned it around to face him. \"I've been keeping my own record,\"","label":"Two independent lines of evidence converging — hers built with no knowledge of his.","pairs":[{"id":"pr-08","label":"Sridevi's first notebook entry"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-16-r1","type":"reveal","text":"her account, built with no knowledge of his diagnosis, mapped almost exactly onto the timeline he'd assembled from the other direction.","label":"The record that corroborates Sunny from the opposite direction.","pairs":[{"id":"pr-16","label":"Sridevi's notebook opening line"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-21-p0","type":"plant","text":"\"This is extraordinary,\" he said, and meant it entirely as a compliment. \"You'd have made a decent clinician.\"","label":"Small, collaborative, and not yet romantic.","pairs":[{"id":"pr-21","label":"Sunny and Sridevi, working together"}],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"note-ch10","type":"note","text":"\"Exactly that,\" Sunny said, and sat with the weight of it a long moment, because the diagnosis, however correct, was, on its own, entirely useless to a household that would never accept a psychiatric explanation on its own terms — and Durgashtami was five days away.","label":"Ends on: Sunny's realization that a clinical diagnosis alone will save no one — the family will never accept it on its own terms.","pairs":[],"chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","sceneId":"s:10:4","thread":null,"characterId":null,"eventId":"e:10","seq":10},{"id":"pr-27-r1","type":"reveal","text":"a conversation, quietly reconstructed, that placed Achuthan Pillai's movements near the kitchen at precisely the relevant window, and a financial motive nobody had bothered examining","label":"The prose resolves it anyway. This reveal contradicts the plan — it needs a decision, not a fix.","pairs":[{"id":"pr-27","label":"The accountant thread — contradicts the planning docs"}],"chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","sceneId":null,"thread":null,"characterId":null,"eventId":"e:11","seq":11},{"id":"pr-11-r1","type":"reveal","text":"\"She had nothing to do with it,\" Sunny said. \"I said what I said to buy time for an investigation that had nothing to do with tea at all, and that was unfair to her, and I'd like the record corrected properly.\"","label":"Retracted in public, at the cost of admitting what the accusation was for.","pairs":[{"id":"pr-11","label":"\"Possessed\" — spoken, then redirected to Sridevi"}],"chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","sceneId":null,"thread":null,"characterId":null,"eventId":"e:11","seq":11},{"id":"pr-17-p0","type":"plant","text":"Old associate. We crossed paths years ago, on a case that needed exactly this kind of cooperation and neither of us expected to find it in the other.","label":"One line, so Act Three can skip a slow-build introduction. The backstory itself stays deliberately unwritten.","pairs":[{"id":"pr-17","label":"Sunny and the Namboodiri's prior association"}],"chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","sceneId":null,"thread":null,"characterId":null,"eventId":"e:11","seq":11},{"id":"note-ch11","type":"note","text":"Sunny went to meet him first, before the family could, and Sridevi, watching from the verandah, saw the two men clasp hands with the specific warmth of an old friendship neither of them had bothered to announce, and felt, for the first time since the keys had gone missing, something that was almost, cautiously, hope.","label":"Ends on: The Namboodiri's palanquin/car arriving at the gate. **End of Act Two.**","pairs":[],"chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","sceneId":"s:11:3","thread":null,"characterId":null,"eventId":"e:11","seq":11},{"id":"pr-17-r1","type":"reveal","text":"I have sat with a great many griefs in my life that called themselves spirits, doctor. I do not think you and I are describing different events.","label":"The collaboration is the payoff. The shared history is never elaborated.","pairs":[{"id":"pr-17","label":"Sunny and the Namboodiri's prior association"}],"chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","sceneId":null,"thread":null,"characterId":null,"eventId":"e:12","seq":12},{"id":"pr-23-r1","type":"reveal","text":"I will perform a correct and complete rite. Whether that satisfies your clinical requirements as well is, I suspect, a question of design rather than contradiction.","label":"The same rite, designed rather than merely performed. (Structural payoff — the supplied table quotes no line for this end.)","pairs":[{"id":"pr-23","label":"The failed puja against the designed rite"}],"chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","sceneId":null,"thread":null,"characterId":null,"eventId":"e:12","seq":12},{"id":"pr-18-p0","type":"plant","text":"a lifelike straw dummy, dressed and weighted to convince a blade under poor light and worse composure; a hidden lever, silent, that would allow the real man to be withdrawn and the substitute swung into place in the same motion; the timing of the ash and smoke coordinated exactly against that swap","label":"Designed on the page, in full, three chapters before it runs.","pairs":[{"id":"pr-18","label":"The ritual mechanism — dummy, lever, ash and smoke"}],"chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","sceneId":null,"thread":null,"characterId":null,"eventId":"e:12","seq":12},{"id":"note-ch12","type":"note","text":"\"I'll make sure of it,\" Sunny said, and meant it.","label":"Ends on: The Namboodiri's blessing of the plan, in ritual language that means something different to him than it does to Sunny — and both of them fine with that.","pairs":[],"chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","sceneId":"s:12:3","thread":null,"characterId":null,"eventId":"e:12","seq":12},{"id":"pr-19-p0","type":"plant","text":"Hold still. Trust the ground under your feet more than what your eyes are telling you. That's all I'm asking.","label":"The one thing this book ever actually asks of him.","pairs":[{"id":"pr-19","label":"Nakulan asked to trust and hold still"},{"id":"pr-18","label":"The ritual mechanism — dummy, lever, ash and smoke"}],"chapterId":"ch:13","chapterTitle":"THE NIGHT BEFORE","sceneId":null,"thread":null,"characterId":null,"eventId":"e:13","seq":13},{"id":"pr-20-p0","type":"plant","text":"I'm frightened, Nakulan. Not of the ghost. Of not knowing what I've been doing while I wasn't there for it.","label":"The real fear, stated the night before, and it is not the ghost.","pairs":[{"id":"pr-20","label":"Ganga fears not knowing what she has done"}],"chapterId":"ch:13","chapterTitle":"THE NIGHT BEFORE","sceneId":null,"thread":null,"characterId":null,"eventId":"e:13","seq":13},{"id":"note-ch13","type":"note","text":"He only knew that tomorrow, one way or another, something in this house was finally going to be asked to answer for itself, and that he intended to be standing exactly where he was asked to stand when it did.","label":"Ends on: Nakulan and Ganga's hands, briefly touching, neither of them saying what they mean.","pairs":[],"chapterId":"ch:13","chapterTitle":"THE NIGHT BEFORE","sceneId":"s:13:3","thread":null,"characterId":null,"eventId":"e:13","seq":13},{"id":"thread-the-goddess-and-the-demon-1","type":"note","text":"\"He is here,\" the Namboodiri agreed, matching her register exactly, \"and the debt will be answered, as promised","label":"Durgashtami is the night Durga kills Mahishasura. The alter casts itself as the goddess and Nakulan as the demon, which is exactly the wrong way round.","pairs":[],"chapterId":"ch:14","chapterTitle":"DURGASHTAMI","sceneId":null,"thread":"The goddess and the demon","characterId":"c:ganga","eventId":"e:14","seq":14},{"id":"pr-13-r2","type":"reveal","text":"Sunny watched Ganga's — Nagavalli's — gaze find him and soften, entirely, into something that had nothing to do with the flat fury of a moment before","label":"Dramatised: the alter was never attacking him. It was recognising him as Ramanathan.","pairs":[{"id":"pr-13","label":"Mahadevan's clean hands"},{"id":"pr-14","label":"The voice's unusually accurate history"}],"chapterId":"ch:14","chapterTitle":"DURGASHTAMI","sceneId":null,"thread":null,"characterId":null,"eventId":"e:14","seq":14},{"id":"note-ch14","type":"note","text":"The blade continued its arc toward Nakulan's unmoving, trusting form, and Sunny's fingers closed on the lever.","label":"Ends on: The sword raised.","pairs":[],"chapterId":"ch:14","chapterTitle":"DURGASHTAMI","sceneId":"s:14:3","thread":null,"characterId":null,"eventId":"e:14","seq":14},{"id":"pr-18-r1","type":"reveal","text":"casting a great handful of sacred ash and thick ceremonial smoke directly into the path of the descending blade","label":"The blinding: ritually correct and operationally necessary at the same instant.","pairs":[{"id":"pr-18","label":"The ritual mechanism — dummy, lever, ash and smoke"}],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":null,"thread":null,"characterId":null,"eventId":"e:15","seq":15},{"id":"pr-18-r2","type":"reveal","text":"The lever gave way smoothly, silently","label":"The swap, executed under pressure.","pairs":[{"id":"pr-18","label":"The ritual mechanism — dummy, lever, ash and smoke"}],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":null,"thread":null,"characterId":null,"eventId":"e:15","seq":15},{"id":"pr-19-r1","type":"reveal","text":"Nakulan — who had, to his eternal credit, not flinched, not moved, held the trust he'd been asked to hold with a stillness Sunny would remember for the rest of his life","label":"He holds. It is the whole of his arc, paid in one sentence.","pairs":[{"id":"pr-19","label":"Nakulan asked to trust and hold still"},{"id":"pr-18","label":"The ritual mechanism — dummy, lever, ash and smoke"}],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":null,"thread":null,"characterId":null,"eventId":"e:15","seq":15},{"id":"pr-15-r1","type":"reveal","text":"It fell with the full, blind, absolute fury of a hundred and fifty years","label":"The blade falls, on the night it was promised for.","pairs":[{"id":"pr-15","label":"The Durgashtami deadline"}],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":null,"thread":null,"characterId":null,"eventId":"e:15","seq":15},{"id":"thread-the-goddess-and-the-demon-2","type":"note","text":"\"Go freely,\" he said, \"as you were promised. The debt is paid. You are released.\"","label":"The frame is honoured in form and refused in substance: the rite completes, the killing does not. Both traditions get to claim the result.","pairs":[],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":null,"thread":"The goddess and the demon","characterId":"c:ganga","eventId":"e:15","seq":15},{"id":"note-ch15","type":"note","text":"\"You're safe, and it's over.\"","label":"Ends on: Ganga, on the ground, breathing, herself.","pairs":[],"chapterId":"ch:15","chapterTitle":"THE SWAP","sceneId":"s:15:4","thread":null,"characterId":null,"eventId":"e:15","seq":15},{"id":"pr-20-r1","type":"reveal","text":"\"You don't have her memories,\" Sunny said, gently, \"because they were never yours to have.","label":"Answered honestly rather than kindly.","pairs":[{"id":"pr-20","label":"Ganga fears not knowing what she has done"}],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:16","seq":16},{"id":"pr-05-r1","type":"reveal","text":"\"There's something else,\" he said, on the third day, when she was steady enough to hear it. \"Nakulan told me. About the pregnancy.\"","label":"Named at last, and deliberately kept separate from the dissociation.","pairs":[{"id":"pr-05","label":"The hand on the stomach"}],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:16","seq":16},{"id":"pr-22-r1","type":"reveal","text":"\"The room's staying open,\" Valyammai said. \"I decided. No more locking things away and hoping.\"","label":"The prohibition withdrawn, by the person who issued it.","pairs":[{"id":"pr-22","label":"The locked door, and Valyammai's warning"}],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:16","seq":16},{"id":"pr-21-r1","type":"reveal","text":"I was thinking you might consider coming with me","label":"The proposal — earned across several such moments rather than declared.","pairs":[{"id":"pr-21","label":"Sunny and Sridevi, working together"}],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:16","seq":16},{"id":"pr-21-r2","type":"reveal","text":"and said yes","label":"Two words, after a paragraph of him not managing to ask cleanly.","pairs":[{"id":"pr-21","label":"Sunny and Sridevi, working together"}],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":null,"characterId":null,"eventId":"e:16","seq":16},{"id":"thread-the-forbidden-chamber-2","type":"note","text":"the Thekkini's door standing open behind them in the afternoon light, empty now, ordinary, a room like any other room, waiting for nothing at all.","label":"And the inversion: the taboo is lifted, so the chamber stops being a chamber. It is just a room, which is the most that can be said for it.","pairs":[],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":null,"thread":"The forbidden chamber","characterId":"c:ganga","eventId":"e:16","seq":16},{"id":"note-ch16","type":"note","text":"He nodded, and didn't press for more, and the car carried them out through the gates and onto the long red road, leaving the house and its century and a half of carefully guarded silence behind them, open now, at last, to whatever the family chose to do with the truth instead.","label":"Ends on: Ganga and Nakulan leaving the estate; the Thekkini's door, standing open now, empty, ordinary. **End of Act Three. End of book.**","pairs":[],"chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","sceneId":"s:16:4","thread":null,"characterId":null,"eventId":"e:16","seq":16}],"chapters":[{"id":"ch:0","title":"WHAT THE COURT REMEMBERS","book":0,"act":1,"seq":0,"status":"drafted","words":4683,"eventId":"e:0"},{"id":"ch:1","title":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","book":0,"act":1,"seq":1,"status":"drafted","words":4541,"eventId":"e:1"},{"id":"ch:2","title":"FAR-AWAY MOODS","book":0,"act":1,"seq":2,"status":"drafted","words":4851,"eventId":"e:2"},{"id":"ch:3","title":"THE KEY","book":0,"act":1,"seq":3,"status":"drafted","words":5228,"eventId":"e:3"},{"id":"ch:4","title":"THE EYES THAT FOLLOW","book":0,"act":1,"seq":4,"status":"drafted","words":4841,"eventId":"e:4"},{"id":"ch:5","title":"WHAT THE PUJA COULDN'T FIX","book":0,"act":1,"seq":5,"status":"drafted","words":5513,"eventId":"e:5"},{"id":"ch:6","title":"THE MAN FROM AMERICA","book":0,"act":2,"seq":6,"status":"drafted","words":5399,"eventId":"e:6"},{"id":"ch:7","title":"MIDNIGHT IN THE THEKKINI","book":0,"act":2,"seq":7,"status":"drafted","words":4980,"eventId":"e:7"},{"id":"ch:8","title":"LOCKED IN HER OWN ROOM","book":0,"act":2,"seq":8,"status":"drafted","words":5095,"eventId":"e:8"},{"id":"ch:9","title":"WHAT EVOOR REMEMBERS","book":0,"act":2,"seq":9,"status":"drafted","words":5252,"eventId":"e:9"},{"id":"ch:10","title":"THE DIAGNOSIS","book":0,"act":2,"seq":10,"status":"drafted","words":5786,"eventId":"e:10"},{"id":"ch:11","title":"WHAT SRIDEVI KNEW","book":0,"act":2,"seq":11,"status":"drafted","words":5024,"eventId":"e:11"},{"id":"ch:12","title":"TWO TRADITIONS, ONE PLAN","book":0,"act":3,"seq":12,"status":"drafted","words":5193,"eventId":"e:12"},{"id":"ch:13","title":"THE NIGHT BEFORE","book":0,"act":3,"seq":13,"status":"drafted","words":4558,"eventId":"e:13"},{"id":"ch:14","title":"DURGASHTAMI","book":0,"act":3,"seq":14,"status":"drafted","words":4588,"eventId":"e:14"},{"id":"ch:15","title":"THE SWAP","book":0,"act":3,"seq":15,"status":"drafted","words":4447,"eventId":"e:15"},{"id":"ch:16","title":"WHAT GANGA REMEMBERS","book":0,"act":3,"seq":16,"status":"drafted","words":5609,"eventId":"e:16"}],"scenes":[{"id":"s:0:0","chapterId":"ch:0","seq":0,"title":"Thanjavur court, Nagavalli performing; Ramanathan watchin…","summary":"Thanjavur court, Nagavalli performing; Ramanathan watching from the margins — established as already her partner, not a later \"seduction.\"","pov":"Nagavalli","status":"drafted"},{"id":"s:0:1","chapterId":"ch:0","seq":1,"title":"The Karanavar's visit; the transaction that removes her f…","summary":"The Karanavar's visit; the transaction that removes her from the court, told plainly, without romance.","pov":"Nagavalli","status":"drafted"},{"id":"s:0:2","chapterId":"ch:0","seq":2,"title":"Arrival at Madampalli; the Thekkini as a gift that is als…","summary":"Arrival at Madampalli; the Thekkini as a gift that is also a cage.","pov":"Nagavalli","status":"drafted"},{"id":"s:0:3","chapterId":"ch:0","seq":3,"title":"Ramanathan's cottage, the secret visits.","summary":"Ramanathan's cottage, the secret visits.","pov":"Nagavalli","status":"drafted"},{"id":"s:0:4","chapterId":"ch:0","seq":4,"title":"The night: the Karanavar discovers them, goes to the cott…","summary":"The night: the Karanavar discovers them, goes to the cottage first — controlled, methodical, not a crime of passion — then to the Thekkini.","pov":"Nagavalli","status":"drafted"},{"id":"s:1:0","chapterId":"ch:1","seq":0,"title":"Arrival at Madampalli; the extended family already assemb…","summary":"Arrival at Madampalli; the extended family already assembling, unable to let the couple go alone.","pov":"Nakulan","status":"drafted"},{"id":"s:1:1","chapterId":"ch:1","seq":1,"title":"Valyammai's formal warning about the Thekkini, told in fu…","summary":"Valyammai's formal warning about the Thekkini, told in full — the family version of the legend (Story Bible §1), delivered as fact.","pov":"Nakulan","status":"drafted"},{"id":"s:1:2","chapterId":"ch:1","seq":2,"title":"Ganga's visible, performative skepticism in front of the …","summary":"Ganga's visible, performative skepticism in front of the family.","pov":"Nakulan","status":"drafted"},{"id":"s:1:3","chapterId":"ch:1","seq":3,"title":"A quiet aside: Nakulan's own reason for insisting on stay…","summary":"A quiet aside: Nakulan's own reason for insisting on staying here — refusing to let the house's reputation run his life.","pov":"Nakulan","status":"drafted"},{"id":"s:1:4","chapterId":"ch:1","seq":4,"title":"First hint of Ganga's \"far-away moods,\" read by Nakulan a…","summary":"First hint of Ganga's \"far-away moods,\" read by Nakulan as ordinary tiredness from travel.","pov":"Nakulan","status":"drafted"},{"id":"s:2:0","chapterId":"ch:2","seq":0,"title":"A quiet domestic scene; Nakulan notices Ganga somewhere e…","summary":"A quiet domestic scene; Nakulan notices Ganga somewhere else entirely for several seconds, snapping back as if nothing happened.","pov":"Nakulan","status":"drafted"},{"id":"s:2:1","chapterId":"ch:2","seq":1,"title":"A brief, deflected exchange about a recent loss — kept va…","summary":"A brief, deflected exchange about a recent loss — kept vague enough not to name it outright (see Patch 1).","pov":"Nakulan","status":"drafted"},{"id":"s:2:2","chapterId":"ch:2","seq":2,"title":"Nakulan mentions Sunny by name, establishing the friendsh…","summary":"Nakulan mentions Sunny by name, establishing the friendship and the fact that Sunny is \"the person you call when something's wrong that a doctor here won't understand.\"","pov":"Nakulan","status":"drafted"},{"id":"s:2:3","chapterId":"ch:2","seq":3,"title":"Family gossip overheard: comparisons of Ganga to a relati…","summary":"Family gossip overheard: comparisons of Ganga to a relative with a history of \"melancholy\" — the red herring the family will lean on later.","pov":"Nakulan","status":"drafted"},{"id":"s:3:0","chapterId":"ch:3","seq":0,"title":"Sridevi witnesses Ganga persuading Alli to help steal the…","summary":"Sridevi witnesses Ganga persuading Alli to help steal the keys — recounts it faithfully, without embellishment, already the book's most reliable narrator.","pov":"Sridevi","status":"drafted"},{"id":"s:3:1","chapterId":"ch:3","seq":1,"title":"The theft itself; the Thekkini's external door, used spec…","summary":"The theft itself; the Thekkini's external door, used specifically so they needn't cross the main house.","pov":"Sridevi","status":"drafted"},{"id":"s:3:2","chapterId":"ch:3","seq":2,"title":"Inside: the anklets, the lamp, the cracked mirror — Ganga…","summary":"Inside: the anklets, the lamp, the cracked mirror — Ganga's reaction is curiosity, not fear, and specifically a *recognition* she can't explain to herself.","pov":"Sridevi","status":"drafted"},{"id":"s:3:3","chapterId":"ch:3","seq":3,"title":"They relock the room; nobody else knows yet.","summary":"They relock the room; nobody else knows yet.","pov":"Sridevi","status":"drafted"},{"id":"s:4:0","chapterId":"ch:4","seq":0,"title":"The portrait gallery, connecting the main house to the Th…","summary":"The portrait gallery, connecting the main house to the Thekkini's outer door; a portrait of the historical Karanavar has a slashed or defaced section — nobody in the present generation remembers why or when.","pov":"Nakulan","status":"drafted"},{"id":"s:4:1","chapterId":"ch:4","seq":1,"title":"Household objects begin shattering inexplicably — staged …","summary":"Household objects begin shattering inexplicably — staged so it's plausible as draft, structural settling, or (unconfirmed) something else.","pov":"Nakulan","status":"drafted"},{"id":"s:4:2","chapterId":"ch:4","seq":2,"title":"Valyammai's fear sharpens into open dread; she notices th…","summary":"Valyammai's fear sharpens into open dread; she notices the Thekkini's lock has been disturbed.","pov":"Nakulan","status":"drafted"},{"id":"s:4:3","chapterId":"ch:4","seq":3,"title":"Ganga's mood shifts sharply and briefly at dinner — gone …","summary":"Ganga's mood shifts sharply and briefly at dinner — gone before anyone can name it.","pov":"Nakulan","status":"drafted"},{"id":"s:5:0","chapterId":"ch:5","seq":0,"title":"The disturbed lock is discovered by the whole family; the…","summary":"The disturbed lock is discovered by the whole family; the theft is s clinical plan for a controlled confrontation and exit event are, mechanically, close enough to run as one ritual.","pov":"Sunny","status":"drafted"},{"id":"s:12:2","chapterId":"ch:12","seq":2,"title":"Together they design the Durgashtami ritual: a public, ce…","summary":"Together they design the Durgashtami ritual: a public, ceremonially correct exorcism that is secretly staged to give Ganga's alter the confrontation and \"victory\" it needs (a symbolic execution of the Karanavar) without anyone actually getting hurt.","pov":"Sunny","status":"drafted"},{"id":"s:12:3","chapterId":"ch:12","seq":3,"title":"The mechanism is set: a lifelike straw dummy, a lever/swa…","summary":"The mechanism is set: a lifelike straw dummy, a lever/swap mechanism, sacred ash and smoke as both ritual element and practical blind for the swap.","pov":"Sunny","status":"drafted"},{"id":"s:13:0","chapterId":"ch:13","seq":0,"title":"Preparations for the Durgashtami ritual across the househ…","summary":"Preparations for the Durgashtami ritual across the household — the ceremonial dressing of the courtyard.","pov":"Nakulan","status":"drafted"},{"id":"s:13:1","chapterId":"ch:13","seq":1,"title":"Sunny and Sridevi brief Nakulan, gently, on what's actual…","summary":"Sunny and Sridevi brief Nakulan, gently, on what's actually going to happen and what his role requires of him — steady nerve, trust, and silence.","pov":"Nakulan","status":"drafted"},{"id":"s:13:2","chapterId":"ch:13","seq":2,"title":"A quiet scene between Nakulan and Ganga (her lucid self) …","summary":"A quiet scene between Nakulan and Ganga (her lucid self) — neither of them naming what's coming, both aware something is.","pov":"Nakulan","status":"drafted"},{"id":"s:13:3","chapterId":"ch:13","seq":3,"title":"Valyammai's private fear, handled with dignity — she has …","summary":"Valyammai's private fear, handled with dignity — she has already lost one relative to this story, generations back (**[OPEN]** — ties to the Ch 9 forty-years
