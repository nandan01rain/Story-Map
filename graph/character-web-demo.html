needsReview":false},{"id":"i5","from":"c:ganga","to":"c:sridevi","type":"alliance","valence":"positive","description":"protective of her even while everyone else grows afraid of her, without fully knowing why she trusts her.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":false},{"id":"i9","from":"c:nakulan","to":"c:sunny","type":"alliance","valence":"positive","description":"old, easy friendship; the reason he came at all.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":false},{"id":"i11","from":"c:nakulan","to":"c:elders","type":"confrontation","valence":"ambiguous","description":"caught between them and his wife for most of Act One and Two.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i14","from":"c:sunny","to":"c:sridevi","type":"alliance","valence":"positive","description":"the book's central non-romantic-coded-until-suddenly-it-is relationship; built on being taken seriously by someone for the first time in the story.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":false},{"id":"i16","from":"c:sunny","to":"c:elders","type":"confrontation","valence":"ambiguous","description":"They read him as a clown for longer than he minds — informal, irreverent, unbothered by a hierarchy the house runs on. He lets them, because being underestimated makes people drop their guard, and it is the elders whose permission he will eventually need.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i17","from":"c:sridevi","to":"c:elders","type":"confrontation","valence":"negative","description":"polite deference masking real hurt at how quickly they turned on her.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":false},{"id":"i18","from":"c:alli","to":"c:mahadevan","type":"romantic","valence":"positive","description":"engaged; the strain of his wrongful suspicion (Ch 6) tests but doesn't break them.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":false},{"id":"i24","from":"c:nakulan","to":"c:thambi","type":"other","valence":"ambiguous","description":"No relationship in life — they are separated by a hundred and fifty years. But Ganga’s alter casts Nakulan as the Karanavar, so he inherits a role he never asked for and cannot argue his way out of.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i25","from":"c:mahadevan","to":"c:ramanathan","type":"other","valence":"ambiguous","description":"Mahadevan is the real-world trigger the “Ramanathan” projection latches onto. Nothing about him invites it; proximity and the wrong moment are enough.","eventId":null,"eventLabel":null,"seq":-1,"needsReview":true},{"id":"i21","from":"c:nagavalli","to":"c:ramanathan","type":"romantic","valence":"positive","description":"Partners for two years before the Karanavar bought her out of the Thanjavur court, and again in secret at Madampalli. Careful, and eventually not careful enough. Ch 0 gives them the book’s only true account of what they were to each other, so every later retelling of the legend reads against it.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i22","from":"c:nagavalli","to":"c:thambi","type":"betrayal","valence":"negative","description":"He did not kill her in a rage. Ch 0 is explicit that he arrived having already decided the shape of the evening and simply walked through its stages — which is what the family legend spends a century and a half softening into something more bearable.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i23","from":"c:ramanathan","to":"c:thambi","type":"betrayal","valence":"negative","description":"Killed first, and separately, at the cottage. The order matters: the Karanavar went to him before he went to her, methodically, which is the detail the sanitised family version loses.","eventId":"e:0","eventLabel":"WHAT THE COURT REMEMBERS","seq":0,"needsReview":false},{"id":"i10","from":"c:nakulan","to":"c:sunny","type":"alliance","valence":"positive","description":"old, easy friendship; the reason he came at all.","eventId":"e:2","eventLabel":"FAR-AWAY MOODS","seq":2,"needsReview":false},{"id":"i6","from":"c:ganga","to":"c:alli","type":"other","valence":"ambiguous","description":"enabler, then unwitting near-victim of her.","eventId":"e:3","eventLabel":"THE KEY","seq":3,"needsReview":true},{"id":"i8","from":"c:ganga","to":"c:mahadevan","type":"confrontation","valence":"ambiguous","description":"Read by the household as harassment and by Ganga’s alter as recognition. Both readings are wrong, and the family acts on theirs — which is what puts Mahadevan under suspicion.","eventId":"e:6","eventLabel":"THE MAN FROM AMERICA","seq":6,"needsReview":true},{"id":"i19","from":"c:mahadevan","to":"c:elders","type":"confrontation","valence":"negative","description":"The elders turn on him quickly and completely, on no evidence, because a culprit is easier to hold than an explanation.","eventId":"e:6","eventLabel":"THE MAN FROM AMERICA","seq":6,"needsReview":true},{"id":"i3","from":"c:ganga","to":"c:sunny","type":"alliance","valence":"positive","description":"trusts him instinctively before either of them knows why; this should read, in hindsight, as the alter recognizing an ally.","eventId":"e:7","eventLabel":"MIDNIGHT IN THE THEKKINI","seq":7,"needsReview":false},{"id":"i7","from":"c:ganga","to":"c:alli","type":"confrontation","valence":"negative","description":"The “attack” on Alli, which is a dissociative episode misdirected rather than an assault. Alli helped her open the Thekkini in Ch 3 and is repaid by being the nearest body when the episode breaks.","eventId":"e:8","eventLabel":"LOCKED IN HER OWN ROOM","seq":8,"needsReview":false},{"id":"i4","from":"c:ganga","to":"c:sunny","type":"mentorship","valence":"ambiguous","description":"Sunny reaches the correct diagnosis and decides not to say it aloud yet. The hardest part of his arc is not the diagnosis; it is choosing to build the cure inside the family’s belief system rather than against it.","eventId":"e:10","eventLabel":"THE DIAGNOSIS","seq":10,"needsReview":true},{"id":"i13","from":"c:sunny","to":"c:sridevi","type":"alliance","valence":"positive","description":"the book's central non-romantic-coded-until-suddenly-it-is relationship; built on being taken seriously by someone for the first time in the story.","eventId":"e:11","eventLabel":"WHAT SRIDEVI KNEW","seq":11,"needsReview":false},{"id":"i15","from":"c:sunny","to":"c:namboodiri","type":"alliance","valence":"ambiguous","description":"The book’s thesis in one conversation. The Namboodiri never concedes that Sunny is right; he simply builds his ritual around Sunny’s plan and lets both traditions claim the result.","eventId":"e:12","eventLabel":"TWO TRADITIONS, ONE PLAN","seq":12,"needsReview":false},{"id":"i1","from":"c:ganga","to":"c:nakulan","type":"confrontation","valence":"negative","description":"The alter takes over fully and recasts her husband as the man who killed her. The text should read this as tragic rather than symbolic — she is not really angry at Nakulan, the substrate trauma simply needed a face, and his was the one available.","eventId":"e:13","eventLabel":"THE NIGHT BEFORE","seq":13,"needsReview":true},{"id":"i20","from":"c:namboodiri","to":"c:elders","type":"alliance","valence":"positive","description":"His blessing is what lets the family accept the outcome without ever being told the clinical truth. The vessel a truth arrives in matters as much as the truth.","eventId":"e:14","eventLabel":"DURGASHTAMI","seq":14,"needsReview":false},{"id":"i12","from":"c:sunny","to":"c:sridevi","type":"romantic","valence":"positive","description":"He proposes. It should read as earned rather than tacked on — built across several small scenes of two people doing careful work together while everyone around them reacts.","eventId":"e:16","eventLabel":"WHAT GANGA REMEMBERS","seq":16,"needsReview":false}],"flags":[{"id":"pr-24-p0","type":"plant","text":"She kept, in a box she told no one about, a single dried jasmine flower from the first night he had told her, plainly, without performance, that he loved her","label":"Never returned to, anywhere in the manuscript.","pairId":"pr-24","pairLabel":"The dried jasmine flower","chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","eventId":"e:0","seq":0},{"id":"pr-01-p0","type":"plant","text":"There was no negotiation in the way stories would later tell it. There was a price, and a party who received it, and Nagavalli was not that party.","label":"The transaction stated plainly, in the only chapter with no family legend layered over it.","pairId":"pr-01","pairLabel":"Nagavalli was purchased, not courted","chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","eventId":"e:0","seq":0},{"id":"pr-02-p0","type":"plant","text":"that he had gone to Ramanathan with the particular unhurried calm of a man who has already decided the shape of the evening and is merely walking through its stages, that there had been no shouting, no crime of passion in the way the word suggested a loss of control, only a decision, executed.","label":"The cottage first, and the calm of a man walking through stages he has already decided.","pairId":"pr-02","pairLabel":"Sequential, methodical murders — not one crime of passion","chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","eventId":"e:0","seq":0},{"id":"pr-25-p0","type":"plant","text":"The anklets were still on the floor of the Thekkini three days later","label":"Set down where they fell, and left there for a century and a half.","pairId":"pr-25","pairLabel":"The anklets, the mirror, the lamp","chapterId":"ch:0","chapterTitle":"WHAT THE COURT REMEMBERS","eventId":"e:0","seq":0},{"id":"pr-22-p0","type":"plant","text":"\"You will not go near that door,\" Valyammai said","label":"The prohibition, delivered to the room and aimed at one person in it.","pairId":"pr-22","pairLabel":"The locked door, and Valyammai's warning","chapterId":"ch:1","chapterTitle":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","eventId":"e:1","seq":1},{"id":"pr-03-p0","type":"plant","text":"he knew this only because Ganga's slippers, left neatly by the door the night before, were faintly, inexplicably, dusty.","label":"She has already walked the gallery, before anyone thinks the keys are missing.","pairId":"pr-03","pairLabel":"Ganga's dusty slippers, night one","chapterId":"ch:1","chapterTitle":"THE HOUSE THAT KEEPS ITS DOORS LOCKED","eventId":"e:1","seq":1},{"id":"pr-04-p0","type":"plant","text":"that half-second delay, the eyes catching up to the face a beat after the face had already begun to smile.","label":"The first visible trace of the alter, dressed as tiredness.","pairId":"pr-04","pairLabel":"Ganga's far-away lapses","chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","eventId":"e:2","seq":2},{"id":"pr-05-p0","type":"plant","text":"Ganga's hand moved, without her seeming to notice it moving, to rest flat against her stomach","label":"The undisclosed grief, gestured at and never named.","pairId":"pr-05","pairLabel":"The hand on the stomach","chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","eventId":"e:2","seq":2},{"id":"pr-06-p0","type":"plant","text":"You know I did my residency partly on a dissociative disorders ward. Nothing scares me anymore.","label":"The diagnosis is in his mouth in Chapter 2, as a joke, eight chapters before he means it.","pairId":"pr-06","pairLabel":"Sunny's dissociative-ward joke","chapterId":"ch:2","chapterTitle":"FAR-AWAY MOODS","eventId":"e:2","seq":2},{"id":"pr-09-p0","type":"plant","text":"Sridevi noticed things. It was not a virtue she had cultivated so much as a habit she had backed into, the way a person backs into a corner of a crowded room without deciding to — she had grown up slightly to the side of this family's attention, close enough to be included, never quite close enough to be the center of anything, and a person in that position learns, without meaning to, to watch.","label":"Established as temperament long before it becomes useful.","pairId":"pr-09","pairLabel":"Sridevi's habit of quiet observation","chapterId":"ch:3","chapterTitle":"THE KEY","eventId":"e:3","seq":3},{"id":"pr-25-p1","type":"plant","text":"a cracked mirror that had lost most of its silvering, and, near the foot of the bed, a pair of anklets, tarnished black","label":"Seen again, close up — and then not used.","pairId":"pr-25","pairLabel":"The anklets, the mirror, the lamp","chapterId":"ch:3","chapterTitle":"THE KEY","eventId":"e:3","seq":3},{"id":"pr-07-p0","type":"plant","text":"heard her say something under her breath. A few words, low, in a cadence that was almost but not quite the Tamil the household used, the accent slightly wrong","label":"A language learned by ear rather than lived in — the tell that it was performed at her, not inherited.","pairId":"pr-07","pairLabel":"The unfamiliar Tamil phrase","chapterId":"ch:3","chapterTitle":"THE KEY","eventId":"e:3","seq":3},{"id":"pr-08-p0","type":"plant","text":"G. said something in the Thekkini. Not sure what. Didn't sound like her.","label":"The record begins the day of the key theft, before anyone knows there is anything to record.","pairId":"pr-08","pairLabel":"Sridevi's first notebook entry","chapterId":"ch:3","chapterTitle":"THE KEY","eventId":"e:3","seq":3},{"id":"pr-26-p0","type":"plant","text":"a long diagonal slash through the painted hands, crudely repaired with backing cloth that had itself gone dark with age.","label":"The slash goes through the hands specifically. Ch 9's true history never reconnects to the image.","pairId":"pr-26","pairLabel":"The damaged ancestor portrait","chapterId":"ch:4","chapterTitle":"THE EYES THAT FOLLOW","eventId":"e:4","seq":4},{"id":"pr-10-p0","type":"plant","text":"A tumbler on the dining table, standing undisturbed, no one within arm's reach, simply — cracked, cleanly","label":"The first breakage, with a perfectly reasonable explanation already attached to it.","pairId":"pr-10","pairLabel":"Objects shattering with no clear cause","chapterId":"ch:4","chapterTitle":"THE EYES THAT FOLLOW","eventId":"e:4","seq":4},{"id":"pr-23-p0","type":"plant","text":"The rite ended without incident, which should have been a relief and instead only deepened the unease in the room — a ritual that produces no visible effect is, to a frightened household, not evidence of nothing happening but evidence that whatever is happening is stronger than the tools they have to address it.","label":"Tradition alone, and it does nothing.","pairId":"pr-23","pairLabel":"The failed puja against the designed rite","chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","eventId":"e:5","seq":5},{"id":"pr-12-p0","type":"plant","text":"Ganga, standing near the shrine room's lamps, her saree already alight along one edge, moving — not screaming, not panicking, moving with a strange deliberate slowness","label":"Deliberate slowness where panic belongs — the detail that makes it a state, not an attack.","pairId":"pr-12","pairLabel":"The saree fire","chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","eventId":"e:5","seq":5},{"id":"pr-11-p0","type":"plant","text":"watched it land first, uncertainly, on his own wife, a dozen frightened eyes finding her and flinching away again as though the accusation were too large to actually hold in place — and then, in the scramble to find somewhere safer to put it, watched it swing instead toward Sridevi","label":"The accusation looking for somewhere safer to land.","pairId":"pr-11","pairLabel":"\"Possessed\" — spoken, then redirected to Sridevi","chapterId":"ch:5","chapterTitle":"WHAT THE PUJA COULDN'T FIX","eventId":"e:5","seq":5},{"id":"pr-09-r1","type":"reveal","text":"You have the look of someone who writes things down.","label":"Sunny reads it off her in one line, which is how he ends up with a corroborating witness.","pairId":"pr-09","pairLabel":"Sridevi's habit of quiet observation","chapterId":"ch:6","chapterTitle":"THE MAN FROM AMERICA","eventId":"e:6","seq":6},{"id":"pr-13-p0","type":"plant","text":"He noted that Mahadevan, kneeling several feet away, had both hands empty and neither sleeve so much as creased.","label":"The physical evidence nobody else in that corridor is looking at.","pairId":"pr-13","pairLabel":"Mahadevan's clean hands","chapterId":"ch:6","chapterTitle":"THE MAN FROM AMERICA","eventId":"e:6","seq":6},{"id":"pr-14-p0","type":"plant","text":"details that made Sunny's clinical instincts sharpen even through the genuine unease crawling up his spine: precise turns of phrase, an intimacy with the geography of a court two hundred miles from here","label":"Accuracy no family retelling could carry.","pairId":"pr-14","pairLabel":"The voice's unusually accurate history","chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","eventId":"e:7","seq":7},{"id":"pr-15-p0","type":"plant","text":"\"On Durgashtami,\" the voice said, when the account was finished, \"you will answer for it. I will finish what his hands began, and this time nothing will stop the blade.\"","label":"The deadline that structures the whole of Act Three.","pairId":"pr-15","pairLabel":"The Durgashtami deadline","chapterId":"ch:7","chapterTitle":"MIDNIGHT IN THE THEKKINI","eventId":"e:7","seq":7},{"id":"pr-16-p0","type":"plant","text":"I did not do this,* she wrote, first, because she needed the sentence in her own handwriting where she could look at it.","label":"Written for herself, with no expectation that anyone will ever read it.","pairId":"pr-16","pairLabel":"Sridevi's notebook opening line","chapterId":"ch:8","chapterTitle":"LOCKED IN HER OWN ROOM","eventId":"e:8","seq":8},{"id":"pr-27-p0","type":"plant","text":"the argument she'd overheard three days earlier between Achuthan Pillai and Nakulan's uncle over the quarterly accounts — a detail she had noted at the time only out of habit","label":"Story Bible §3 and the Continuity Timeline both specify this thread stays unresolved.","pairId":"pr-27","pairLabel":"The accountant thread — contradicts the planning docs","chapterId":"ch:8","chapterTitle":"LOCKED IN HER OWN ROOM","eventId":"e:8","seq":8},{"id":"pr-01-r1","type":"reveal","text":"It's not wrong, exactly. It's just missing the part where nobody asked her anything.","label":"Bhargavi Amma names what the family's version leaves out.","pairId":"pr-01","pairLabel":"Nagavalli was purchased, not courted","chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","eventId":"e:9","seq":9},{"id":"pr-02-r1","type":"reveal","text":"the murders themselves, described not as a single unified act of a man undone by passion but as two separate, sequential acts, the cottage first, methodical, and only afterward, drunk and unravelling, the Thekkini.","label":"The outside record confirms the order, which is the detail the legend sands off.","pairId":"pr-02","pairLabel":"Sequential, methodical murders — not one crime of passion","chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","eventId":"e:9","seq":9},{"id":"pr-14-r1","type":"reveal","text":"Whoever, or whatever, was speaking from behind that locked door knew a version of the story the family itself did not know.","label":"Matched against the Evoor record — and it narrows the field of explanation rather than widening it.","pairId":"pr-14","pairLabel":"The voice's unusually accurate history","chapterId":"ch:9","chapterTitle":"WHAT EVOOR REMEMBERS","eventId":"e:9","seq":9},{"id":"pr-10-r1","type":"reveal","text":"laying every fact he had out on the small writing desk in his room the way he'd once been trained to lay out a differential diagnosis — not in order of drama, but in order of evidence.","label":"Folded into the evidence list. Note: that paragraph never names the shattering objects — this payoff is structural, not stated.","pairId":"pr-10","pairLabel":"Objects shattering with no clear cause","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-04-r1","type":"reveal","text":"Ganga's far-away moods, first noted by Nakulan before either of them had reason to think anything of it.","label":"Recognised as an early dissociative symptom rather than travel fatigue.","pairId":"pr-04","pairLabel":"Ganga's far-away lapses","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-03-r1","type":"reveal","text":"The dust on her slippers, the very first morning, before the keys were even officially missing.","label":"Read back as evidence, in Sunny's differential.","pairId":"pr-03","pairLabel":"Ganga's dusty slippers, night one","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-12-r1","type":"reveal","text":"The saree fire, which Ganga genuinely did not seem to remember, staged close enough to open flame that it read, on close honest examination, far more plausibly as an accident involving a person not fully present in her own body than as an attack by anything external.","label":"Confirmed as a dissociative-state accident.","pairId":"pr-12","pairLabel":"The saree fire","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-13-r1","type":"reveal","text":"The Alli incident, where the physical evidence — Mahadevan's empty, uncreased hands — had never actually supported the accusation","label":"Stated outright: the household convicted him by proximity.","pairId":"pr-13","pairLabel":"Mahadevan's clean hands","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-14-r2","type":"reveal","text":"a version, Sunny was now near certain, that could only have reached Ganga through an unusually thorough, unusually immersive childhood exposure","label":"The clinical conclusion drawn from it. (The supplied table lists this line under Ch 9; it is in Ch 10.)","pairId":"pr-14","pairLabel":"The voice's unusually accurate history","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-07-r1","type":"reveal","text":"a grand-aunt on Ganga's side, now deceased, who had spent years steeped in Tamil court-dance history, who had — the cousin remembered this vividly, laughing slightly at the memory — used to perform the whole Nagavalli story for a young, rapt Ganga, in full costume","label":"Traced to the grand-aunt, in costume, again and again.","pairId":"pr-07","pairLabel":"The unfamiliar Tamil phrase","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-06-r1","type":"reveal","text":"He wrote out the clinical picture in full, for his own clarity as much as anything: a Dissociative Identity Disorder","label":"The joke, made seriously.","pairId":"pr-06","pairLabel":"Sunny's dissociative-ward joke","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-08-r1","type":"reveal","text":"she reached for her notebook and turned it around to face him. \"I've been keeping my own record,\"","label":"Two independent lines of evidence converging — hers built with no knowledge of his.","pairId":"pr-08","pairLabel":"Sridevi's first notebook entry","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-16-r1","type":"reveal","text":"her account, built with no knowledge of his diagnosis, mapped almost exactly onto the timeline he'd assembled from the other direction.","label":"The record that corroborates Sunny from the opposite direction.","pairId":"pr-16","pairLabel":"Sridevi's notebook opening line","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-21-p0","type":"plant","text":"\"This is extraordinary,\" he said, and meant it entirely as a compliment. \"You'd have made a decent clinician.\"","label":"Small, collaborative, and not yet romantic.","pairId":"pr-21","pairLabel":"Sunny and Sridevi, working together","chapterId":"ch:10","chapterTitle":"THE DIAGNOSIS","eventId":"e:10","seq":10},{"id":"pr-27-r1","type":"reveal","text":"a conversation, quietly reconstructed, that placed Achuthan Pillai's movements near the kitchen at precisely the relevant window, and a financial motive nobody had bothered examining","label":"The prose resolves it anyway. This reveal contradicts the plan — it needs a decision, not a fix.","pairId":"pr-27","pairLabel":"The accountant thread — contradicts the planning docs","chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","eventId":"e:11","seq":11},{"id":"pr-11-r1","type":"reveal","text":"\"She had nothing to do with it,\" Sunny said. \"I said what I said to buy time for an investigation that had nothing to do with tea at all, and that was unfair to her, and I'd like the record corrected properly.\"","label":"Retracted in public, at the cost of admitting what the accusation was for.","pairId":"pr-11","pairLabel":"\"Possessed\" — spoken, then redirected to Sridevi","chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","eventId":"e:11","seq":11},{"id":"pr-17-p0","type":"plant","text":"Old associate. We crossed paths years ago, on a case that needed exactly this kind of cooperation and neither of us expected to find it in the other.","label":"One line, so Act Three can skip a slow-build introduction. The backstory itself stays deliberately unwritten.","pairId":"pr-17","pairLabel":"Sunny and the Namboodiri's prior association","chapterId":"ch:11","chapterTitle":"WHAT SRIDEVI KNEW","eventId":"e:11","seq":11},{"id":"pr-17-r1","type":"reveal","text":"I have sat with a great many griefs in my life that called themselves spirits, doctor. I do not think you and I are describing different events.","label":"The collaboration is the payoff. The shared history is never elaborated.","pairId":"pr-17","pairLabel":"Sunny and the Namboodiri's prior association","chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","eventId":"e:12","seq":12},{"id":"pr-23-r1","type":"reveal","text":"I will perform a correct and complete rite. Whether that satisfies your clinical requirements as well is, I suspect, a question of design rather than contradiction.","label":"The same rite, designed rather than merely performed. (Structural payoff — the supplied table quotes no line for this end.)","pairId":"pr-23","pairLabel":"The failed puja against the designed rite","chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","eventId":"e:12","seq":12},{"id":"pr-18-p0","type":"plant","text":"a lifelike straw dummy, dressed and weighted to convince a blade under poor light and worse composure; a hidden lever, silent, that would allow the real man to be withdrawn and the substitute swung into place in the same motion; the timing of the ash and smoke coordinated exactly against that swap","label":"Designed on the page, in full, three chapters before it runs.","pairId":"pr-18","pairLabel":"The ritual mechanism — dummy, lever, ash and smoke","chapterId":"ch:12","chapterTitle":"TWO TRADITIONS, ONE PLAN","eventId":"e:12","seq":12},{"id":"pr-19-p0","type":"plant","text":"Hold still. Trust the ground under your feet more than what your eyes are telling you. That's all I'm asking.","label":"The one thing this book ever actually asks of him.","pairId":"pr-19","pairLabel":"Nakulan asked to trust and hold still","chapterId":"ch:13","chapterTitle":"THE NIGHT BEFORE","eventId":"e:13","seq":13},{"id":"pr-20-p0","type":"plant","text":"I'm frightened, Nakulan. Not of the ghost. Of not knowing what I've been doing while I wasn't there for it.","label":"The real fear, stated the night before, and it is not the ghost.","pairId":"pr-20","pairLabel":"Ganga fears not knowing what she has done","chapterId":"ch:13","chapterTitle":"THE NIGHT BEFORE","eventId":"e:13","seq":13},{"id":"pr-13-r2","type":"reveal","text":"Sunny watched Ganga's — Nagavalli's — gaze find him and soften, entirely, into something that had nothing to do with the flat fury of a moment before","label":"Dramatised: the alter was never attacking him. It was recognising him as Ramanathan.","pairId":"pr-13","pairLabel":"Mahadevan's clean hands","chapterId":"ch:14","chapterTitle":"DURGASHTAMI","eventId":"e:14","seq":14},{"id":"pr-18-r1","type":"reveal","text":"casting a great handful of sacred ash and thick ceremonial smoke directly into the path of the descending blade","label":"The blinding: ritually correct and operationally necessary at the same instant.","pairId":"pr-18","pairLabel":"The ritual mechanism — dummy, lever, ash and smoke","chapterId":"ch:15","chapterTitle":"THE SWAP","eventId":"e:15","seq":15},{"id":"pr-18-r2","type":"reveal","text":"The lever gave way smoothly, silently","label":"The swap, executed under pressure.","pairId":"pr-18","pairLabel":"The ritual mechanism — dummy, lever, ash and smoke","chapterId":"ch:15","chapterTitle":"THE SWAP","eventId":"e:15","seq":15},{"id":"pr-19-r1","type":"reveal","text":"Nakulan — who had, to his eternal credit, not flinched, not moved, held the trust he'd been asked to hold with a stillness Sunny would remember for the rest of his life","label":"He holds. It is the whole of his arc, paid in one sentence.","pairId":"pr-19","pairLabel":"Nakulan asked to trust and hold still","chapterId":"ch:15","chapterTitle":"THE SWAP","eventId":"e:15","seq":15},{"id":"pr-15-r1","type":"reveal","text":"It fell with the full, blind, absolute fury of a hundred and fifty years","label":"The blade falls, on the night it was promised for.","pairId":"pr-15","pairLabel":"The Durgashtami deadline","chapterId":"ch:15","chapterTitle":"THE SWAP","eventId":"e:15","seq":15},{"id":"pr-20-r1","type":"reveal","text":"\"You don't have her memories,\" Sunny said, gently, \"because they were never yours to have.","label":"Answered honestly rather than kindly.","pairId":"pr-20","pairLabel":"Ganga fears not knowing what she has done","chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","eventId":"e:16","seq":16},{"id":"pr-05-r1","type":"reveal","text":"\"There's something else,\" he said, on the third day, when she was steady enough to hear it. \"Nakulan told me. About the pregnancy.\"","label":"Named at last, and deliberately kept separate from the dissociation.","pairId":"pr-05","pairLabel":"The hand on the stomach","chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","eventId":"e:16","seq":16},{"id":"pr-22-r1","type":"reveal","text":"\"The room's staying open,\" Valyammai said. \"I decided. No more locking things away and hoping.\"","label":"The prohibition withdrawn, by the person who issued it.","pairId":"pr-22","pairLabel":"The locked door, and Valyammai's warning","chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","eventId":"e:16","seq":16},{"id":"pr-21-r1","type":"reveal","text":"I was thinking you might consider coming with me","label":"The proposal — earned across several such moments rather than declared.","pairId":"pr-21","pairLabel":"Sunny and Sridevi, working together","chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","eventId":"e:16","seq":16},{"id":"pr-21-r2","type":"reveal","text":"and said yes","label":"Two words, after a paragraph of him not managing to ask cleanly.","pairId":"pr-21","pairLabel":"Sunny and Sridevi, working together","chapterId":"ch:16","chapterTitle":"WHAT GANGA REMEMBERS","eventId":"e:16","seq":16}]};</script>

<!-- Only the 2D renderer loads up front. It is the default, needs no three.js, and is a
     fraction of the weight — which matters on a phone opening this over mobile data.
     3D and its dependencies are fetched the first time someone asks for them; see load3D. -->
<script src="https://cdn.jsdelivr.net/npm/force-graph@1/dist/force-graph.min.js"></script>
<script>
(function () {
  var EMPTY = { nodes: [], links: [], events: [], presence: [], interactions: [], flags: [] };
  var raw = window.__GRAPH__ || EMPTY;
  var mode = 'rel';       // 'rel' | 'prog' | 'flags'
  var flagFilter = 'all'; // 'all' | 'plants' | 'reveals' | 'pairs' | 'open'
  var dim = '2d';         // '2d' | '3d'
  var graph = null;
  var selectedId = null;

  // The whole graph, every layer at once. The view is the slice currently handed to the
  // renderer; both hold the same node objects, which is what preserves the layout.
  var all = { nodes: [], links: [] };
  var view = { nodes: [], links: [] };
  var byId = {};
  var pairs = {};       // pairId -> { id, label, plants: [], reveals: [] }
  var progOrder = {};   // event id -> position in the selected character's arc
  var progChain = [];   // the selected character's events, in chapter order
  var labelEverything = false;

  var TYPE_COLOR = {
    confrontation: '#e0764a', alliance: '#6fae74', betrayal: '#c0504d',
    mentorship: '#5b9bd5', romantic: '#c47ab5', other: '#8d9a97'
  };
  var EVENT_COLOR = '#7f8fa0';
  var PROG_COLOR = '#c69a3a';
  // Two blues, and the difference between them is the point: the tapped event itself glows
  // bright, the lines running out of it take the darker shade so the node still reads as the
  // thing that was tapped.
  var EVENT_SELECTED = '#4da3ff';
  var EVENT_SELECTED_LINK = '#1c5fae';
  var PLANT_COLOR = '#5aa469';
  var REVEAL_COLOR = '#c0504d';
  var PAIR_COLOR = '#c69a3a';
  var GHOST = 'rgba(120,132,129,0.07)';
  var GHOST_NODE = 'rgba(120,132,129,0.16)';

  function build() {
    var nodes = raw.nodes.map(function (n) {
      return { id: n.id, label: n.label, kind: 'character', degree: n.degree || 0, needsReview: n.needsReview };
    });

    // Chronological serial numbers, assigned once over the whole cast of events. This is the
    // default numbering everywhere except a character's own progression.
    var events = (raw.events || []).slice().sort(function (a, b) {
      return (a.seq || 0) - (b.seq || 0);
    });
    events.forEach(function (ev, i) {
      nodes.push({
        id: ev.id, label: ev.label, kind: 'event',
        seq: ev.seq, chronoNo: i + 1, participants: ev.participants || 0,
        properties: ev.properties || {}
      });
    });

    pairs = {};
    (raw.flags || []).forEach(function (f) {
      var key = f.pairId || ('solo:' + f.id);
      if (!pairs[key]) pairs[key] = { id: key, label: f.pairLabel || f.label || 'Unpaired', plants: [], reveals: [] };
      pairs[key][f.type === 'plant' ? 'plants' : 'reveals'].push(f);
      nodes.push({
        id: f.id, label: f.text, kind: f.type,
        pairId: key, pairLabel: pairs[key].label, flagLabel: f.label,
        chapterTitle: f.chapterTitle, eventId: f.eventId, seq: f.seq
      });
    });

    var links = (raw.links || []).map(function (l) {
      return { source: l.source, target: l.target, layer: 'rel', type: l.type || 'other', count: l.count || 1 };
    });
    (raw.presence || []).forEach(function (p) {
      links.push({ source: p.character, target: p.event, layer: 'prog', isPov: p.isPov });
    });
    // A flag hangs off the event for its chapter, so a plant sits where it was sown rather
    // than drifting loose. A chapter with no event node yet simply has no such link, and its
    // flags float -- still listed, still selectable, just unanchored.
    (raw.flags || []).forEach(function (f) {
      if (f.eventId) links.push({ source: f.id, target: f.eventId, layer: 'flag', flagType: f.type });
    });
    Object.keys(pairs).forEach(function (key) {
      var pair = pairs[key];
      pair.plants.forEach(function (p) {
        pair.reveals.forEach(function (r) {
          links.push({ source: p.id, target: r.id, layer: 'pair', pairId: key });
        });
      });
    });

    // The index is read off the link objects on every frame; walking the array to find one
    // was fine at a few dozen links and is not at several hundred.
    links.forEach(function (l, i) { l.i = i; });

    all = { nodes: nodes, links: links };
    byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
  }

  function layersFor(m) {
    if (m === 'rel') return { rel: true };
    if (m === 'prog') return { prog: true };
    return { flag: true, pair: true };
  }

  // Which flag nodes the sub-filter admits. Events and characters are decided separately:
  // events stay as context in every flag view, characters are dropped entirely because a
  // plant has nothing to do with who was standing near it.
  function flagVisible(n) {
    if (flagFilter === 'all') return true;
    if (flagFilter === 'plants') return n.kind === 'plant';
    if (flagFilter === 'reveals') return n.kind === 'reveal';
    var pair = pairs[n.pairId];
    if (!pair) return false;
    if (flagFilter === 'pairs') return pair.plants.length > 0 && pair.reveals.length > 0;
    return pair.reveals.length === 0; // 'open' -- a plant nobody has paid yet
  }

  function rebuildView() {
    var layers = layersFor(mode);
    var keep = {};

    // Flags first, so the event pass below can ask which events any of them still land in.
    // Under a filter, an event with no surviving flag is a diamond with nothing to say --
    // sixteen of those around four unpaid plants is the filter failing to filter.
    var anchored = {};
    if (mode === 'flags') {
      all.nodes.forEach(function (n) {
        if ((n.kind === 'plant' || n.kind === 'reveal') && flagVisible(n)) {
          keep[n.id] = true;
          if (n.eventId) anchored[n.eventId] = true;
        }
      });
    }

    var nodes = all.nodes.filter(function (n) {
      var ok;
      if (n.kind === 'character') ok = mode !== 'flags';
      else if (n.kind === 'event') ok = mode === 'prog' || (mode === 'flags' && !!anchored[n.id]);
      else ok = !!keep[n.id];
      if (ok) keep[n.id] = true;
      return ok;
    });
    var links = all.links.filter(function (l) {
      if (!layers[l.layer]) return false;
      var e = endpoints(l);
      return keep[e[0]] && keep[e[1]];
    });
    view = { nodes: nodes, links: links };
    // Whether there are few enough non-character nodes to label them all unconditionally.
    // Counted here rather than inside the draw call, which runs per node per frame.
    labelEverything = nodes.filter(function (n) { return n.kind !== 'character'; }).length <= 8;
    if (selectedId && !keep[selectedId]) selectedId = null;
    return view;
  }

  function endpoints(l) {
    return [
      typeof l.source === 'object' ? l.source.id : l.source,
      typeof l.target === 'object' ? l.target.id : l.target
    ];
  }

  // What the current selection lights up. One hop in every layer, plus one deliberate second
  // hop per layer where the second hop is the whole point: in Progression, who ELSE is
  // standing in these events; in Plants, the far end of the pair and the moment it lands in.
  function activeSet() {
    if (!selectedId) return null;
    var nodes = {}, links = {};
    nodes[selectedId] = true;

    function hop(test) {
      view.links.forEach(function (l) {
        var e = endpoints(l);
        if (test(l, e)) { links[l.i] = true; nodes[e[0]] = true; nodes[e[1]] = true; }
      });
    }

    hop(function (l, e) { return e[0] === selectedId || e[1] === selectedId; });

    if (mode === 'prog') {
      hop(function (l, e) { return l.layer === 'prog' && nodes[e[1]] && !nodes[e[0]]; });
    } else if (mode === 'flags') {
      // The pair link is reached first, so this second pass picks up each counterpart's own
      // event -- without it a reveal lights up with no indication of where it lands.
      hop(function (l, e) { return l.layer === 'flag' && nodes[e[0]] && !nodes[e[1]]; });
    }

    return { nodes: nodes, links: links };
  }

  var active = null;

  // In Progression, a character's own events are renumbered from the start of THEIR arc --
  // 1 is their first appearance, not the book's first chapter. Everyone else's events lose
  // their number entirely rather than showing a chronological one beside a progression one,
  // which would be two numbering schemes on screen at once meaning different things.
  function recomputeProgression() {
    progOrder = {};
    progChain = [];
    var me = byId[selectedId];
    if (mode !== 'prog' || !me || me.kind !== 'character') return;

    var mine = [];
    all.links.forEach(function (l) {
      if (l.layer !== 'prog') return;
      var e = endpoints(l);
      if (e[0] !== selectedId) return;
      var ev = byId[e[1]];
      if (ev) mine.push(ev);
    });
    mine.sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); });
    mine.forEach(function (ev, i) { progOrder[ev.id] = i + 1; });
    progChain = mine;
  }

  function serialOf(n) {
    if (n.kind !== 'event') return null;
    if (mode === 'prog' && progChain.length > 0) return progOrder[n.id] || null;
    return n.chronoNo || null;
  }

  function nodeColor(n) {
    var base;
    if (n.kind === 'event') base = EVENT_COLOR;
    else if (n.kind === 'plant') base = PLANT_COLOR;
    else if (n.kind === 'reveal') base = REVEAL_COLOR;
    else base = n.needsReview ? '#c69a3a' : '#cfd8d5';

    if (n.id === selectedId) {
      // An event answers in blue wherever it is tapped; everything else keeps the gold that
      // means "this is the one you picked" elsewhere in the app.
      return n.kind === 'event' ? EVENT_SELECTED : (n.kind === 'character' ? '#f2c94c' : base);
    }
    if (!active) return base;
    return active.nodes[n.id] ? base : GHOST_NODE;
  }

  function linkColor(l) {
    var base;
    if (l.layer === 'prog') base = PROG_COLOR;
    else if (l.layer === 'pair') base = PAIR_COLOR;
    else if (l.layer === 'flag') base = l.flagType === 'plant' ? PLANT_COLOR : REVEAL_COLOR;
    else base = TYPE_COLOR[l.type] || TYPE_COLOR.other;

    if (!active) {
      if (l.layer === 'prog') return 'rgba(198,154,58,0.35)';
      if (l.layer === 'pair') return 'rgba(198,154,58,0.28)';
      if (l.layer === 'flag') return l.flagType === 'plant' ? 'rgba(90,164,105,0.4)' : 'rgba(192,80,77,0.4)';
      return base;
    }
    if (!active.links[l.i]) return GHOST;
    // A tapped event takes its lines with it: the same darker blue, so the reach of one
    // moment reads at a glance. A tapped character keeps the gold running outward.
    var selected = byId[selectedId];
    if (selected && selected.kind === 'event' && l.layer === 'prog') return EVENT_SELECTED_LINK;
    return base;
  }

  function linkWidth(l) {
    if (active) return active.links[l.i] ? 2.6 : 0.3;
    if (l.layer === 'prog') return 0.7;
    if (l.layer === 'flag') return 0.8;
    if (l.layer === 'pair') return 1.2;
    return Math.min(4, 0.7 + (l.count || 1) * 0.45);
  }

  function nodeRadius(n) {
    // Events are drawn larger than they used to be because they now carry a number inside
    // them, and a serial you cannot read is worse than no serial at all.
    if (n.kind === 'event') return 5 + Math.min(3.5, (n.participants || 0) * 0.5);
    if (n.kind === 'plant' || n.kind === 'reveal') return 4.2;
    return 4 + Math.min(7, (n.degree || 0) * 0.7);
  }

  function traceShape(n, ctx, r) {
    ctx.beginPath();
    if (n.kind === 'event') {
      ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y);
      ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
    } else if (n.kind === 'plant' || n.kind === 'reveal') {
      // A plant points up and a reveal points down, so a pair reads as two halves of one
      // shape even before you notice the colour -- which matters for anyone who cannot tell
      // the green from the red.
      var up = n.kind === 'plant' ? -1 : 1;
      ctx.moveTo(n.x, n.y + up * r * 1.15);
      ctx.lineTo(n.x + r, n.y - up * r * 0.85);
      ctx.lineTo(n.x - r, n.y - up * r * 0.85);
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
    }
  }

  // Labels are drawn, not hovered. A graph of unlabelled dots cannot be navigated -- you
  // cannot decide what to tap. Event labels appear only when the graph is small enough or
  // the event is in the current selection, because seventeen chapter titles at once is
  // noise; flag labels follow the same rule for the same reason, at fifty-odd.
  function drawNode(n, ctx, scale) {
    var r = nodeRadius(n);
    var color = nodeColor(n);
    var faded = active && !active.nodes[n.id] && n.id !== selectedId;

    if (n.id === selectedId) {
      ctx.save();
      ctx.shadowColor = n.kind === 'event' ? EVENT_SELECTED : color;
      ctx.shadowBlur = 18 / scale;
    }
    traceShape(n, ctx, r);
    ctx.fillStyle = color;
    ctx.fill();
    if (n.id === selectedId) {
      ctx.restore();
      traceShape(n, ctx, r);
      ctx.lineWidth = 1.6 / scale;
      ctx.strokeStyle = n.kind === 'event' ? EVENT_SELECTED : '#f2c94c';
      ctx.stroke();
    }

    // The serial, inside the diamond. Sized against the node rather than against the zoom,
    // so it stays put in the shape it belongs to instead of swelling out of it.
    var serial = serialOf(n);
    if (serial && !faded) {
      ctx.font = '600 ' + (r * 1.05) + 'px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(9,13,12,0.88)';
      ctx.fillText(String(serial), n.x, n.y + r * 0.04);
    }

    var showLabel = n.kind === 'character' || labelEverything || (active && active.nodes[n.id]);
    if (!showLabel) return;

    var size = Math.max(3.5, 11 / scale);
    ctx.font = size + 'px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    if (faded) ctx.fillStyle = 'rgba(160,172,169,0.25)';
    else if (n.kind === 'event') ctx.fillStyle = '#9fb0bd';
    else if (n.kind === 'plant') ctx.fillStyle = '#8fc99a';
    else if (n.kind === 'reveal') ctx.fillStyle = '#dd9895';
    else ctx.fillStyle = '#e6ecea';
    ctx.fillText(n.kind === 'character' ? n.label : shorten(n.label, 22), n.x, n.y + r + 1.5);
  }

  // The path a character takes through their own story, drawn under everything else as one
  // continuous line rather than as a fan of separate edges. The gold spokes still run out of
  // the character -- this is the other half of the answer, the order those events happen in.
  //
  // Drawn as a frame overlay instead of as extra links because a link would join the
  // simulation and pull the events into a ring; this reads the positions the layout already
  // chose and never influences them.
  function drawProgressionPath(ctx, scale) {
    if (mode !== 'prog' || progChain.length < 2) return;
    var points = progChain.filter(function (n) { return typeof n.x === 'number'; });
    if (points.length < 2) return;

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(198,154,58,0.20)';
    ctx.lineWidth = 5 / scale;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(242,201,76,0.75)';
    ctx.lineWidth = 1.4 / scale;
    ctx.stroke();

    // One arrowhead per segment, at its midpoint: without direction the path says which
    // events are connected but not which way the character moves through them.
    ctx.fillStyle = 'rgba(242,201,76,0.85)';
    for (var j = 1; j < points.length; j++) {
      var a = points[j - 1], b = points[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1) continue;
      var mx = a.x + dx / 2, my = a.y + dy / 2;
      var ux = dx / len, uy = dy / len;
      var h = 4 / scale;
      ctx.beginPath();
      ctx.moveTo(mx + ux * h, my + uy * h);
      ctx.lineTo(mx - ux * h * 0.6 - uy * h * 0.6, my - uy * h * 0.6 + ux * h * 0.6);
      ctx.lineTo(mx - ux * h * 0.6 + uy * h * 0.6, my - uy * h * 0.6 - ux * h * 0.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function shorten(s, n) {
    s = String(s || '');
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[<>&]/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
    });
  }

  function labelOf(id) {
    var n = byId[id];
    return n ? n.label : '?';
  }

  function eventProps(id) {
    var n = byId[id];
    return (n && n.properties) || {};
  }

  function item(head, kind, kindColor, where, detail, seq) {
    return '<div class="item">' +
      '<div class="head">' +
        (seq ? '<span class="seq">' + esc(seq) + '</span>' : '') +
        '<span class="who">' + head + '</span>' +
        (kind ? '<span class="kind" style="color:' + kindColor + '">' + esc(kind) + '</span>' : '') +
        '<span class="caret">▾</span>' +
      '</div>' +
      (where ? '<div class="where">' + esc(where) + '</div>' : '') +
      '<div class="detail">' + esc(detail) + '</div>' +
    '</div>';
  }

  function showFocus() {
    var box = document.getElementById('focus');
    var me = byId[selectedId];
    if (!me) { box.style.display = 'none'; return; }

    var html = '';
    if (me.kind === 'plant' || me.kind === 'reveal') html += focusFlag(me);
    else if (me.kind === 'event') html += focusEvent(me);
    else if (mode === 'rel') html += focusRelationships(me);
    else html += focusProgression(me);

    box.innerHTML = html;
    box.style.display = 'block';

    // One open at a time: these run to a couple of paragraphs, and two of them at once
    // pushes the graph off the screen entirely.
    Array.prototype.forEach.call(box.querySelectorAll('.item'), function (el) {
      el.addEventListener('click', function () {
        var wasOpen = el.className.indexOf('open') !== -1;
        Array.prototype.forEach.call(box.querySelectorAll('.item'), function (other) {
          other.className = 'item';
        });
        if (!wasOpen) el.className = 'item open';
      });
    });
  }

  function focusRelationships(me) {
    // Every individual interaction, not the aggregate: a pair who fall out in Ch 6 and
    // reconcile in Ch 12 have two things to say, and one averaged line says neither.
    var mine = (raw.interactions || []).filter(function (it) {
      return it.from === me.id || it.to === me.id;
    });
    var html = '<h3>' + esc(me.label) + '</h3>' +
      '<div class="sub">' + mine.length + ' interaction' + (mine.length === 1 ? '' : 's') + '</div>';
    return html + mine.map(function (it) {
      var otherId = it.from === me.id ? it.to : it.from;
      var kind = it.type || 'other';
      return item(
        esc(labelOf(otherId)), kind, TYPE_COLOR[kind] || TYPE_COLOR.other,
        it.eventLabel || 'Throughout',
        it.description || 'No explanation recorded for this one yet.',
        null
      );
    }).join('');
  }

  function focusProgression(me) {
    var html = '<h3>' + esc(me.label) + '</h3>' +
      '<div class="sub">' + progChain.length + ' event' + (progChain.length === 1 ? '' : 's') +
      ' in their arc, numbered from their first</div>';
    return html + progChain.map(function (ev) {
      var others = [];
      var isPov = false;
      all.links.forEach(function (l) {
        if (l.layer !== 'prog') return;
        var e = endpoints(l);
        if (e[1] !== ev.id) return;
        if (e[0] === me.id) isPov = !!l.isPov;
        else others.push(labelOf(e[0]));
      });
      var props = eventProps(ev.id);
      var detail = props.summary || '';
      if (props.ends_on) detail += (detail ? '\n\n' : '') + 'Ends on: ' + props.ends_on;
      return item(
        (isPov ? '<span style="color:#f2c94c">' : '<span>') + esc(ev.label) + '</span>',
        isPov ? 'their POV' : '', '#f2c94c',
        others.length ? 'with ' + others.join(', ') : '',
        detail || 'No summary recorded for this chapter yet.',
        progOrder[ev.id]
      );
    }).join('');
  }

  function focusEvent(me) {
    var who = [];
    all.links.forEach(function (l) {
      if (l.layer !== 'prog') return;
      var e = endpoints(l);
      if (e[1] === me.id) who.push(byId[e[0]]);
    });
    var here = (raw.flags || []).filter(function (f) { return f.eventId === me.id; });
    var props = me.properties || {};
    var serial = serialOf(me);

    var html = '<h3>' + (serial ? serial + '. ' : '') + esc(me.label) + '</h3>' +
      '<div class="sub">' + who.length + ' present · ' + here.length + ' flag' +
      (here.length === 1 ? '' : 's') + '</div>';
    if (props.summary) html += '<div class="quote">' + esc(props.summary) + '</div>';

    html += who.map(function (c) {
      return item(esc(c ? c.label : '?'), 'present', '#9fb0bd', '',
        'Tap them in Progression to see this event inside their own arc.', null);
    }).join('');
    html += here.map(function (f) {
      return item(esc(shorten(f.text, 46)), f.type, f.type === 'plant' ? PLANT_COLOR : REVEAL_COLOR,
        f.pairLabel || '', f.text + (f.label ? '\n\n' + f.label : ''), null);
    }).join('');
    return html;
  }

  function focusFlag(me) {
    var pair = pairs[me.pairId] || { plants: [], reveals: [], label: me.pairLabel };
    var counterparts = me.kind === 'plant' ? pair.reveals : pair.plants;
    var unpaid = pair.reveals.length === 0;

    var html = '<h3>' + esc(pair.label) + '</h3>' +
      '<div class="sub">' + esc(me.chapterTitle || '') + ' · ' +
      pair.plants.length + ' plant' + (pair.plants.length === 1 ? '' : 's') + ' · ' +
      pair.reveals.length + ' reveal' + (pair.reveals.length === 1 ? '' : 's') +
      (unpaid ? ' · unpaid' : '') + '</div>' +
      '<div class="quote ' + me.kind + '">' + esc(me.label) + '</div>';
    if (me.flagLabel) html += '<div class="sub">' + esc(me.flagLabel) + '</div>';

    if (counterparts.length === 0) {
      html += item(
        me.kind === 'plant' ? 'Nothing pays this off yet' : 'No plant recorded for this reveal',
        'open', '#c69a3a', '',
        me.kind === 'plant'
          ? 'Sown and never claimed. That can be deliberate — an open plant is a real state, not a fault — but nothing downstream currently answers it.'
          : 'This reveal has no plant on the other end of its pair. Either the setup is missing, or it was flagged without one.',
        null
      );
      return html;
    }

    return html + counterparts.map(function (f) {
      return item(
        esc(shorten(f.text, 46)),
        f.type, f.type === 'plant' ? PLANT_COLOR : REVEAL_COLOR,
        f.chapterTitle || '',
        f.text + (f.label ? '\n\n' + f.label : ''),
        null
      );
    }).join('');
  }

  // ---- the index ----------------------------------------------------------
  var indexTab = 'characters';

  function indexRows() {
    var q = (document.getElementById('idx-search').value || '').trim().toLowerCase();
    function hit(s) { return !q || String(s || '').toLowerCase().indexOf(q) !== -1; }

    if (indexTab === 'characters') {
      return all.nodes.filter(function (n) { return n.kind === 'character' && hit(n.label); })
        .sort(function (a, b) { return (b.degree || 0) - (a.degree || 0); })
        .map(function (n) {
          return { id: n.id, no: '', name: n.label, meta: (n.degree || 0) + ' connections', tag: '' };
        });
    }
    if (indexTab === 'events') {
      return all.nodes.filter(function (n) { return n.kind === 'event' && hit(n.label); })
        .sort(function (a, b) { return (a.chronoNo || 0) - (b.chronoNo || 0); })
        .map(function (n) {
          return {
            id: n.id, no: n.chronoNo, name: n.label,
            meta: (n.participants || 0) + ' present', tag: ''
          };
        });
    }
    if (indexTab === 'plants' || indexTab === 'reveals') {
      var kind = indexTab === 'plants' ? 'plant' : 'reveal';
      return all.nodes
        .filter(function (n) {
          return n.kind === kind && (hit(n.label) || hit(n.pairLabel) || hit(n.chapterTitle));
        })
        .sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); })
        .map(function (n) {
          var pair = pairs[n.pairId] || { plants: [], reveals: [] };
          var counterparts = kind === 'plant' ? pair.reveals.length : pair.plants.length;
          return {
            id: n.id, no: '', name: shorten(n.label, 90),
            meta: (n.chapterTitle || '') + ' · ' + n.pairLabel,
            tag: counterparts === 0 ? (kind === 'plant' ? 'unpaid' : 'no plant') : ''
          };
        });
    }

    // Pairs. Ordered by where the plant is sown, so the list reads in the order a reader
    // meets the setups rather than in whatever order the flags were written.
    return Object.keys(pairs)
      .map(function (k) { return pairs[k]; })
      .filter(function (p) {
        return hit(p.label) ||
          p.plants.concat(p.reveals).some(function (f) { return hit(f.text); });
      })
      .sort(function (a, b) {
        var as = a.plants.length ? a.plants[0].seq : 999;
        var bs = b.plants.length ? b.plants[0].seq : 999;
        return as - bs;
      })
      .map(function (p) {
        var anchor = (p.plants[0] || p.reveals[0] || {}).id;
        var where = p.plants.length && p.reveals.length
          ? p.plants[0].chapterTitle + ' → ' + p.reveals[p.reveals.length - 1].chapterTitle
          : (p.plants[0] || p.reveals[0] || {}).chapterTitle || '';
        return {
          id: anchor, no: '', name: p.label, meta: where,
          tag: p.reveals.length === 0 ? 'unpaid' : (p.plants.length === 0 ? 'no plant' : '')
        };
      });
  }

  function renderIndex() {
    var rows = indexRows();
    var host = document.getElementById('idx-rows');
    if (rows.length === 0) {
      host.innerHTML = '<div class="none">Nothing here matches that.</div>';
      return;
    }
    host.innerHTML = rows.map(function (r) {
      return '<div class="row" data-id="' + esc(r.id) + '">' +
        (r.no ? '<span class="no">' + esc(r.no) + '</span>' : '') +
        '<span class="name"><b>' + esc(r.name) + '</b>' +
          (r.meta ? '<span class="meta">' + esc(r.meta) + '</span>' : '') +
        '</span>' +
        (r.tag ? '<span class="tag">' + esc(r.tag) + '</span>' : '') +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(host.querySelectorAll('.row'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        closeIndex();
        // A flag is only selectable in its own layer, and an event is not drawn at all in
        // Relationships -- so the index switches to a layer that can actually show what was
        // tapped rather than selecting something invisible.
        var n = byId[id];
        if (n && (n.kind === 'plant' || n.kind === 'reveal')) {
          if (mode !== 'flags') setMode('flags');
          if (!flagVisible(n)) setFlagFilter('all');
        } else if (n && n.kind === 'event' && mode === 'rel') {
          setMode('prog');
        }
        select(id);
        focusCamera(id);
      });
    });
  }

  function openIndex() {
    document.getElementById('index').style.display = 'flex';
    renderIndex();
  }
  function closeIndex() {
    document.getElementById('index').style.display = 'none';
  }

  function focusCamera(id) {
    var n = byId[id];
    if (!graph || !n || typeof n.x !== 'number') return;
    if (dim === '2d') {
      graph.centerAt(n.x, n.y, 600);
      graph.zoom(Math.max(graph.zoom(), 2.4), 600);
    } else if (graph.cameraPosition) {
      var d = 90;
      var r = Math.hypot(n.x, n.y, n.z || 0) || 1;
      graph.cameraPosition(
        { x: n.x * (1 + d / r), y: n.y * (1 + d / r), z: (n.z || 0) * (1 + d / r) },
        n, 900
      );
    }
  }

  // ---- wiring -------------------------------------------------------------
  function post(msg) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }

  function select(id) {
    selectedId = id;
    recomputeProgression();
    active = activeSet();
    refresh();
    showFocus();
    post({ type: 'select', id: id, label: id ? labelOf(id) : null, kind: id && byId[id] ? byId[id].kind : null });
  }

  function refresh() {
    if (!graph) return;
    graph.nodeColor(nodeColor).linkColor(linkColor).linkWidth(linkWidth);
    if (dim === '3d' && graph.linkDirectionalParticles) {
      graph.linkDirectionalParticles(function (l) {
        if (!active) return 0;
        return active.links[l.i] ? 3 : 0;
      });
    }
  }

  function render() {
    var el = document.getElementById('graph');
    el.innerHTML = '';
    var factory = dim === '3d' ? window.ForceGraph3D : window.ForceGraph;
    if (!factory) { document.getElementById('error').style.display = 'flex'; return; }

    graph = factory()(el)
      .graphData(rebuildView())
      .backgroundColor('#0d1110')
      .nodeLabel('label')
      .nodeColor(nodeColor)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .onNodeClick(function (n) { select(n.id === selectedId ? null : n.id); })
      .onBackgroundClick(function () { select(null); });

    if (dim === '2d') {
      graph.nodeCanvasObject(drawNode)
           .onRenderFramePre(drawProgressionPath)
           .linkLineDash(function (l) { return l.layer === 'pair' ? [4, 3] : null; })
           .nodePointerAreaPaint(function (n, color, ctx) {
             // A generous hit area: the drawn shape is small, and a finger is not.
             ctx.fillStyle = color;
             ctx.beginPath();
             ctx.arc(n.x, n.y, nodeRadius(n) + 5, 0, 2 * Math.PI);
             ctx.fill();
           });
    } else {
      graph.nodeVal(function (n) { return nodeRadius(n); })
           .linkDirectionalParticleWidth(2.2)
           .linkDirectionalParticleSpeed(0.012);

      graph.nodeThreeObject(function (n) {
        var group = window.THREE ? new window.THREE.Group() : null;
        if (group && n.kind !== 'character') {
          // The same correspondence as in 2D: a diamond becomes an octahedron, a triangle
          // becomes a tetrahedron, so nothing changes identity between the two views.
          var geometry = n.kind === 'event'
            ? new window.THREE.OctahedronGeometry(nodeRadius(n) * 0.9)
            : new window.THREE.TetrahedronGeometry(nodeRadius(n) * 1.15);
          var color = nodeColor(n);
          var mesh = new window.THREE.Mesh(
            geometry,
            new window.THREE.MeshLambertMaterial({
              color: color,
              // The glow, in three dimensions: the selected shape emits its own colour
              // rather than only reflecting the scene light, which is what makes it read as
              // lit rather than merely repainted.
              emissive: n.id === selectedId ? color : '#000000',
              emissiveIntensity: n.id === selectedId ? 0.9 : 0,
              transparent: true, opacity: 0.92
            })
          );
          if (n.kind === 'reveal') mesh.rotation.z = Math.PI;
          group.add(mesh);
        }
        if (window.SpriteText) {
          var t = new window.SpriteText(
            n.kind === 'character' ? n.label
              : (serialOf(n) ? serialOf(n) + '. ' : '') + shorten(n.label, 20)
          );
          t.color = nodeColor(n);
          t.textHeight = n.kind === 'character' ? 3.4 : 2.6;
          t.position.y = -(nodeRadius(n) + 2.5);
          if (group) group.add(t); else return t;
        }
        return group;
      })
      // Characters keep the built-in sphere and gain a label; everything else replaces it
      // entirely, since a diamond inside a sphere is just a sphere.
      .nodeThreeObjectExtend(function (n) { return n.kind === 'character'; });
    }
    refresh();
  }

  // Counts what is on screen, not what exists: a filter whose readout never moves is a
  // filter you cannot tell is working.
  function updateCount() {
    var source = mode === 'flags' ? view.nodes : all.nodes;
    var of = function (kind) {
      return source.filter(function (n) { return n.kind === kind; }).length;
    };
    var el = document.getElementById('count');
    if (mode === 'flags') el.textContent = of('plant') + ' plants · ' + of('reveal') + ' reveals';
    else el.textContent = of('character') + ' cast · ' + of('event') + ' events';
  }

  function start() {
    build();
    var characters = all.nodes.filter(function (n) { return n.kind === 'character'; }).length;
    document.getElementById('empty').style.display = characters === 0 ? 'flex' : 'none';
    if (characters === 0) return;
    render();
    updateCount();
  }

  function setMode(next) {
    mode = next;
    document.getElementById('mode-rel').className = 'chip' + (mode === 'rel' ? ' on' : '');
    document.getElementById('mode-prog').className = 'chip' + (mode === 'prog' ? ' on' : '');
    document.getElementById('mode-flags').className = 'chip' + (mode === 'flags' ? ' on' : '');
    document.getElementById('subhud').className = 'row' + (mode === 'flags' ? ' on' : '');
    if (graph) graph.graphData(rebuildView());
    recomputeProgression();
    active = activeSet();
    updateCount();
    refresh();
    showFocus();
  }

  function setFlagFilter(next) {
    flagFilter = next;
    [['all', 'flag-all'], ['plants', 'flag-plants'], ['reveals', 'flag-reveals'],
     ['pairs', 'flag-pairs'], ['open', 'flag-open']].forEach(function (p) {
      var el = document.getElementById(p[1]);
      var base = p[0] === 'plants' ? 'chip plant' : (p[0] === 'reveals' ? 'chip reveal' : 'chip');
      el.className = base + (flagFilter === p[0] ? ' on' : '');
    });
    if (graph) graph.graphData(rebuildView());
    active = activeSet();
    updateCount();
    refresh();
    showFocus();
  }

  document.getElementById('mode-rel').addEventListener('click', function () { setMode('rel'); });
  document.getElementById('mode-prog').addEventListener('click', function () { setMode('prog'); });
  document.getElementById('mode-flags').addEventListener('click', function () { setMode('flags'); });
  document.getElementById('flag-all').addEventListener('click', function () { setFlagFilter('all'); });
  document.getElementById('flag-plants').addEventListener('click', function () { setFlagFilter('plants'); });
  document.getElementById('flag-reveals').addEventListener('click', function () { setFlagFilter('reveals'); });
  document.getElementById('flag-pairs').addEventListener('click', function () { setFlagFilter('pairs'); });
  document.getElementById('flag-open').addEventListener('click', function () { setFlagFilter('open'); });

  document.getElementById('open-index').addEventListener('click', openIndex);
  document.getElementById('idx-close').addEventListener('click', closeIndex);
  document.getElementById('idx-search').addEventListener('input', renderIndex);
  Array.prototype.forEach.call(document.querySelectorAll('#index .tabs .chip'), function (el) {
    el.addEventListener('click', function () {
      indexTab = el.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('#index .tabs .chip'), function (other) {
        var tab = other.getAttribute('data-tab');
        var base = tab === 'plants' ? 'chip plant' : (tab === 'reveals' ? 'chip reveal' : 'chip');
        other.className = base + (tab === indexTab ? ' on' : '');
      });
      renderIndex();
    });
  });

  // three.js has shipped ESM-only since r160, so there is no UMD build to drop in a script
  // tag -- and 3d-force-graph needs a NEWER three than the last UMD release (it calls
  // THREE.Timer, which r160 does not have), so pinning backwards is not an escape either.
  // The module is imported dynamically and published as the global the two UMD libraries
  // below expect, which is the only combination where all three agree.
  var threeLoading = null;
  function load3D() {
    if (threeLoading) return threeLoading;
    threeLoading = import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js')
      .then(function (mod) {
        window.THREE = mod;
        return script('https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js');
      })
      .then(function () {
        return script('https://cdn.jsdelivr.net/npm/three-spritetext@1/dist/three-spritetext.min.js');
      });
    return threeLoading;
  }

  function script(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = reject;
      document.head.appendChild(el);
    });
  }

  document.getElementById('toggle-dim').addEventListener('click', function () {
    var btn = document.getElementById('toggle-dim');
    if (dim === '2d') {
      btn.textContent = 'Loading…';
      load3D().then(function () {
        dim = '3d';
        btn.textContent = '2D';
        render();
      }).catch(function () {
        btn.textContent = '3D';
        // Staying in 2D is a perfectly good outcome; the graph is still fully usable.
        document.getElementById('count').textContent = '3D unavailable offline';
      });
    } else {
      dim = '2d';
      btn.textContent = '3D';
      render();
    }
  });

  function receive(e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === 'data') {
        raw = msg.payload;
        selectedId = null;
        active = null;
        progChain = [];
        showFocus();
        start();
      }
      if (msg.type === 'mode') setMode(msg.mode);
      if (msg.type === 'index') openIndex();
    } catch (err) {}
  }
  window.addEventListener('message', receive);
  document.addEventListener('message', receive);

  if (window.__GRAPH__) start(); else post({ type: 'ready' });
})();
</script>
</body>
</html>
